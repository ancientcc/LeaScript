#textdomain aplt_leagor_khome-lib

[window]
	app="aplt_leagor_khome"
	id="home"
	[resolution]
		{GUI__COMMON_FLOAT_WIDGETS}
		automatic_placement=false
		definition="scale_screen"
		height="(screen_height)"
		width="(screen_width)"
		x="(0)"
		y="(0)"
		[grid]
			[row]
				[column]
					horizontal_alignment="edge"
					[panel]
						definition="default"
						label="misc/bg_ffffff.png"
						[grid]
							[row]
								[column]
									[spacer]
										definition="default"
										height="(statusbar_height)"
									[/spacer]
								[/column]
							[/row]
							[row]
								[column]
									horizontal_alignment="edge"
									[grid]
										[row]
											[column]
												[spacer]
													definition="default"
													width="(72)"
												[/spacer]
											[/column]
											[column]
												grow_factor=1
												[label]
													definition="default"
													id="title"
													text_font_size=1001
												[/label]
											[/column]
											[column]
												[rose__aplt]
													id="aplt"
												[/rose__aplt]
											[/column]
										[/row]
									[/grid]
								[/column]
							[/row]
							[row]
								[column]
									[spacer]
										definition="default"
									[/spacer]
								[/column]
							[/row]
						[/grid]
					[/panel]
				[/column]
			[/row]
			[row]
				[column]
					border="all"
					border_size=5
					horizontal_alignment="left"
					[label]
						definition="default"
						id="title"
					[/label]
				[/column]
			[/row]
			[row]
				[column]
					border="left, right"
					border_size=8
					horizontal_alignment="edge"
					[grid]
						[row]
							[column]
								horizontal_alignment="left"
								[grid]
									[row]
										[column]
											border="right"
											border_size=8
											horizontal_alignment="left"
											[button]
												definition="vertical_node"
												id="query"
												label=_"Query"
											[/button]
										[/column]
										[column]
											border="right"
											border_size=8
											horizontal_alignment="left"
											[button]
												definition="vertical_node"
												id="restaurant"
												label=_"Restaurant"
											[/button]
										[/column]
										[column]
											border="right"
											border_size=8
											horizontal_alignment="left"
											[button]
												definition="vertical_node"
												id="posture"
												label=_"Posture"
											[/button]
										[/column]
										[column]
											border="right"
											border_size=8
											horizontal_alignment="left"
											[button]
												definition="vertical_node"
												id="face"
												label=_"Face"
											[/button]
										[/column]
									[/row]
								[/grid]
							[/column]
						[/row]
						[row]
							[column]
								border="top"
								border_size=32
								horizontal_alignment="left"
								[label]
									definition="default"
									id="remark"
									mtwusc=true
									state=1
									text_font_size=998
								[/label]
							[/column]
						[/row]
					[/grid]
				[/column]
			[/row]
			[row]
				grow_factor=1
				[column]
					[spacer]
						definition="default"
					[/spacer]
				[/column]
			[/row]
			[row]
				[column]
					[spacer]
						definition="default"
						height="(corner_height)"
					[/spacer]
				[/column]
			[/row]
		[/grid]
	[/resolution]
[/window]
