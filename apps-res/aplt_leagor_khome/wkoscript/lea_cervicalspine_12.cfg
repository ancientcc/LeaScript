[workout]
	author="84年的如意姐"
	id="lea_cervicalspine_12"
	title="颈椎操(12次)"
	reference="https://www.bilibili.com/video/BV1EK411h7r6"
	version="1.0.1-20260903"
	[state2]
		state="播放开场和定位"
		[task]
			msgstr="颈椎操训练。请将手机放正前方。摆好手机后，请站到画面中央，保持身体正对镜头，等待定位完成"
			type="speak"
		[/task]
		[next]
			[branch]
				do_bool_set="set_none"
				do_str=""
				do_to_state=1
				[judge]
					op="bool_equal"
					r_exp=true
					var_exp="$(is_wko_task_finished,)"
				[/judge]
			[/branch]
		[/next]
	[/state2]
	[state2]
		is_setup=true
		state="定位"
		unsatisfied_2th_threshold_s=5
		unsatisfied_threshold_ms=800
		[track_pose]
			[pose]
				landmarks="11,12; 23,24"
				max=275
				min=265
				name="身体歪斜角度"
				operand="point"
				type="angle2p"
				unsatisfied_msgstr="身体不要太歪"
			[/pose]
			[pose]
				landmarks="11,12; 1000"
				max=0.15
				min=-0.15
				name="水平居中"
				operand="x"
				type="diff"
				unsatisfied_msgstr="请往左边平移，靠近摄像头中心"
				unsatisfied_rmax_msgstr="请往右边平移，靠近摄像头中心"
			[/pose]
			[pose]
				landmarks="11,12; 1001"
				min=0.32
				name="举手空间留白"
				operand="y"
				type="diff"
				unsatisfied_msgstr="请后退或抬高手机，让镜头拍到举手"
			[/pose]
			[pose]
				abs=true
				landmarks="11,12; 23,24"
				min=0.2
				name="人物不能太小"
				operand="y"
				type="diff"
				unsatisfied_msgstr="请往前走一点，让身体在画面中更大一些"
			[/pose]
		[/track_pose]
		[task]
			max_count=5
			rule="strict"
			satisfied_threshold_s=3
			tone="full"
			type="time_counter"
		[/task]
		[next]
			[branch]
				do_bool_set="set_none"
				do_str=""
				do_to_state=2
				[judge]
					op="bool_equal"
					r_exp=true
					var_exp="$(is_wko_task_finished,)"
				[/judge]
			[/branch]
		[/next]
	[/state2]
	[state2]
		state="播放第一个动作要领"
		[task]
			msgstr="定位完成。开始第一个动作：仰天开合，做12次"
			type="speak"
		[/task]
		[next]
			[branch]
				do_bool_set="set_none"
				do_str=""
				do_to_state=3
				[judge]
					op="bool_equal"
					r_exp=true
					var_exp="$(is_wko_task_finished,)"
				[/judge]
			[/branch]
		[/next]
	[/state2]
	[state2]
		action_tpl2_id="neck_open_close_lookup_rep"
		state="仰天开合"
		[next]
			[branch]
				do_bool_set="set_none"
				do_str=""
				do_to_state=4
				[judge]
					op="bool_equal"
					r_exp=true
					var_exp="$(is_wko_task_finished,)"
				[/judge]
			[/branch]
		[/next]
	[/state2]
	[state2]
		state="第二个动作开场"
		[task]
			min_state_duration_s=15
			msgstr="下一动作，触肩旋颈，注意，旋转颈椎时要缓慢。请稍作休息"
			type="speak"
		[/task]
		[next]
			[branch]
				do_bool_set="set_none"
				do_str=""
				do_to_state=5
				[judge]
					op="bool_equal"
					r_exp=true
					var_exp="$(is_wko_task_finished,)"
				[/judge]
			[/branch]
		[/next]
	[/state2]
	[state2]
		action_tpl2_id="neck_rotation_shoulder_touch_rep"
		state="触肩旋颈"
		[next]
			[branch]
				do_bool_set="set_none"
				do_str=""
				do_to_state=6
				[judge]
					op="bool_equal"
					r_exp=true
					var_exp="$(is_wko_task_finished,)"
				[/judge]
			[/branch]
		[/next]
	[/state2]
	[state2]
		state="第三个动作开场"
		[task]
			min_state_duration_s=10
			msgstr="下一动作，游禽翘首。请稍作休息"
			type="speak"
		[/task]
		[next]
			[branch]
				do_bool_set="set_none"
				do_str=""
				do_to_state=7
				[judge]
					op="bool_equal"
					r_exp=true
					var_exp="$(is_wko_task_finished,)"
				[/judge]
			[/branch]
		[/next]
	[/state2]
	[state2]
		action_tpl2_id="bird_stretch_neck_up_rep"
		state="游禽翘首"
		[next]
			[branch]
				do_bool_set="set_none"
				do_str=""
				do_to_state=8
				[judge]
					op="bool_equal"
					r_exp=true
					var_exp="$(is_wko_task_finished,)"
				[/judge]
			[/branch]
		[/next]
	[/state2]
	[state2]
		state="已结束"
		[task]
			msgstr="颈椎操，已结束。"
			repeat_s=10
			type="speak"
		[/task]
		[next]
		[/next]
	[/state2]
[/workout]
