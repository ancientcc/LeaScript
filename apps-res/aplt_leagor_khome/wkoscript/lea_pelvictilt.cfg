		action_tpl2_id="dead_bug_rep"
		state="死虫式"
		[next]
			[branch]
				do_bool_set="set_none"
				do_str=""
				do_to_state=6
				[judge]
					op="bool_equal"
					r_exp=true
					var_exp="$(is_wko_task_finished,)"
				[/judge]
			[/branch]
		[/next]
	[/state2]
