[workout]
	author="中国军号"
	id="lea_pelvictilt"
	reference="https://www.bilibili.com/video/BV1kSbB6sEbz"
	title="矫正骨盆前倾"
	version="1.0.1-20260926"
	[state2]
		state="播报开场1"
		[task]
			msgstr="矫正骨盆前倾训练。建议不要穿太宽松裤子，手机摆在右侧，镜头跟身体平行，对准肚脐附近，放好后，原地躺下，左手向后伸直，等待定位完成"
			type="speak"
		[/task]
		[next]
			[branch]
				do_bool_set="set_none"
				do_str=""
				do_to_state=1
				[judge]
					op="bool_equal"
					r_exp=true
					var_exp="$(is_wko_task_finished,)"
				[/judge]
			[/branch]
		[/next]
	[/state2]
	[state2]
		action_tpl2_id="dead_bug_setup"
		state="定位"
		[next]
			[branch]
				do_bool_set="set_none"
				do_str=""
				do_to_state=2
				[judge]
					op="bool_equal"
					r_exp=true
					var_exp="$(is_wko_task_finished,)"
				[/judge]
			[/branch]
		[/next]
	[/state2]
	[state2]
		state="第1个动作开场"
		[task]
			msgstr="定位完成，第1个动作，动态臀桥，臀部与脚跟一掌距离，双脚打开，与肩同宽，用臀部发力，开始"
			type="speak"
		[/task]
		[next]
			[branch]
				do_bool_set="set_none"
				do_str=""
				do_to_state=3
				[judge]
					op="bool_equal"
