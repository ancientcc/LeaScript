			[/branch]
		[/next]
	[/state2]
	[state2]
		action_tpl2_id="glute_bridge_dynamic_rep"
		state="动态臀桥"
		[next]
			[branch]
				do_bool_set="set_none"
				do_str=""
				do_to_state=4
				[judge]
					op="bool_equal"
					r_exp=true
					var_exp="$(is_wko_task_finished,)"
				[/judge]
			[/branch]
		[/next]
	[/state2]
	[state2]
		state="第2个动场开场"
		[task]
			msgstr="第2个动作，死虫式，屁股向脚尖方向微微滑动，把腰压平贴地，抬左脚，举右手，开始"
			type="speak"
		[/task]
		[next]
			[branch]
				do_bool_set="set_none"
				do_str=""
				do_to_state=5
				[judge]
					op="bool_equal"
