[workout]
	author="中国军号"
	id="lea_pelvictilt"
	reference="https://www.bilibili.com/video/BV1kSbB6sEbz"
	title="矫正骨盆前倾"
	version="1.0.1-20260903"
	[state2]
		state="播报开场1"
		[task]
			msgstr="矫正骨盆前倾训练。建议不要穿太宽松裤子，手机摆在右侧，镜头跟身体平行，对准肚脐附近，放好后，原地躺下，左手向后伸直，等待定位完成"
			type="speak"
		[/task]
		[next]
			[branch]
				do_bool_set="set_none"
				do_str=""
				do_to_state=1
				[judge]
					op="bool_equal"
					r_exp=true
					var_exp="$(is_wko_task_finished,)"
				[/judge]
			[/branch]
		[/next]
	[/state2]
	[state2]
		is_setup=true
		state="定位"
		unsatisfied_2th_threshold_s=5
		unsatisfied_threshold_ms=800
		[track_pose]
			[pose]
				landmarks="11; 27"
				min=0.05
				name="画面方向确认"
				operand="x"
				type="diff"
				unsatisfied_msgstr="请掉转方向，让头在画面右侧"
			[/pose]
			[pose]
				landmarks="11; 13"
				max=25
				min=-90
				name="左上臂角度"
				operand="point"
				type="angle2p"
				unsatisfied_msgstr="左侧上臂太朝上，请向后贴地伸平"
			[/pose]
			[pose]
				landmarks="11; 13; 15"
				min=155
				name="左手肘角度"
				operand="point"
				type="angle3p"
				unsatisfied_msgstr="左手肘太弯曲，请伸直"
			[/pose]
			[pose]
				landmarks="11; 23; 25"
				min=155
				name="身体平直度（肩→髋→膝）"
				operand="point"
				type="angle3p"
				unsatisfied_msgstr="身体未完全伸直，请将身体撑成一条直线"
			[/pose]
			[pose]
				abs=true
				landmarks="11; 27"
				max=0.52
				min=0.35
				name="全身画面占比"
				operand="x"
				type="diff"
				unsatisfied_msgstr="靠近或拉近镜头，别太小"
				unsatisfied_rmax_msgstr="后退或推远镜头，别太大"
			[/pose]
			[pose]
				landmarks="23; 1000"
				max=0.15
				min=-0.15
				name="左髋水平居中"
				operand="x"
				type="diff"
				unsatisfied_msgstr="往头侧移动，或反向移手机"
				unsatisfied_rmax_msgstr="往脚侧移动，或反向移手机"
			[/pose]
			[pose]
				landmarks="1002; 15"
				min=0.15
				name="(左)伸手空间留白"
				operand="x"
				type="diff"
				unsatisfied_msgstr="身体往脚侧移点，确保后伸手不超出画面"
			[/pose]
			[pose]
				landmarks="27,28; 1001"
				min=0.4
				name="(上)抬脚空间留白"
				operand="y"
				type="diff"
				unsatisfied_msgstr="太靠上了，会不够伸脚空间，请往后退，或抬高手机"
			[/pose]
		[/track_pose]
		[task]
			max_count=5
			rule="strict"
			satisfied_threshold_s=3
			tone="full"
			type="time_counter"
		[/task]
		[next]
			[branch]
				do_bool_set="set_none"
				do_str=""
				do_to_state=2
				[judge]
					op="bool_equal"
					r_exp=true
					var_exp="$(is_wko_task_finished,)"
				[/judge]
			[/branch]
		[/next]
	[/state2]
	[state2]
		state="第1个动作开场"
		[task]
			msgstr="定位完成，第1个动作，动态臀桥，臀部与脚跟一掌距离，双脚打开，与肩同宽，用臀部发力，开始"
			type="speak"
		[/task]
		[next]
			[branch]
				do_bool_set="set_none"
				do_str=""
				do_to_state=3
				[judge]
					op="bool_equal"
					r_exp=true
					var_exp="$(is_wko_task_finished,)"
				[/judge]
			[/branch]
		[/next]
	[/state2]
	[state2]
		action_tpl2_id="glute_bridge_dynamic_rep"
		state="动态臀桥"
		[next]
			[branch]
				do_bool_set="set_none"
				do_str=""
				do_to_state=4
				[judge]
					op="bool_equal"
					r_exp=true
					var_exp="$(is_wko_task_finished,)"
				[/judge]
			[/branch]
		[/next]
	[/state2]
	[state2]
		state="第2个动场开场"
		[task]
			msgstr="第2个动作，死虫式，屁股向脚尖方向微微滑动，把腰压平贴地，抬左脚，举右手，开始"
			type="speak"
		[/task]
		[next]
			[branch]
				do_bool_set="set_none"
				do_str=""
				do_to_state=5
				[judge]
					op="bool_equal"
					r_exp=true
					var_exp="$(is_wko_task_finished,)"
				[/judge]
			[/branch]
		[/next]
	[/state2]
	[state2]
		action_tpl2_id="dead_bug_rep"
		state="死虫式"
		[track_pose]
			[pose]
				diff_id="[angle2p]-[point]-[23; 25]-[1]"
				unsatisfied_rmax_msgstr="左大腿太靠近脚尖，膝盖往头部方向收。"
			[/pose]
		[/track_pose]
		[task]
			max_count=10
			[phase]
				min_duration_ms=1600
			[/phase]
			[phase]
				min_duration_ms=1600
			[/phase]
		[/task]
		[next]
			[branch]
				do_bool_set="set_none"
				do_str=""
				do_to_state=6
				[judge]
					op="bool_equal"
					r_exp=true
					var_exp="$(is_wko_task_finished,)"
				[/judge]
			[/branch]
		[/next]
	[/state2]
	[state2]
		state="已结束"
		[task]
			msgstr="矫正骨盆前倾，已结束。"
			repeat_s=10
			type="speak"
		[/task]
		[next]
		[/next]
	[/state2]
[/workout]
