[workout]
	author="焦老师营养学"
	id="lea_shoulderneck_10s"
	title="肩颈操(10秒)"
	reference="https://www.bilibili.com/video/BV1oC4y1r7dh"
	version="1.0.1-20260903"
	[state2]
		state="播放开场和定位"
		[task]
			msgstr="肩颈操训练。请将手机放正前方。摆好手机后，请站到画面中央，保持身体正对镜头，等待定位完成。"
			type="speak"
		[/task]
		[next]
			[branch]
				do_bool_set="set_none"
				do_str=""
				do_to_state=1
				[judge]
					op="bool_equal"
					r_exp=true
					var_exp="$(is_wko_task_finished,)"
				[/judge]
			[/branch]
		[/next]
	[/state2]
	[state2]
		is_setup=true
		state="定位1"
		unsatisfied_2th_threshold_s=5
		unsatisfied_threshold_ms=800
		[track_pose]
			[pose]
				landmarks="11,12; 23,24"
				max=275
				min=265
				name="身体歪斜角度"
				operand="point"
				type="angle2p"
				unsatisfied_msgstr="身体不要太歪"
			[/pose]
			[pose]
				landmarks="11,12; 1000"
				max=0.15
				min=-0.15
				name="水平居中"
				operand="x"
				type="diff"
				unsatisfied_msgstr="请往左边平移，靠近摄像头中心"
				unsatisfied_rmax_msgstr="请往右边平移，靠近摄像头中心"
			[/pose]
			[pose]
				landmarks="11,12; 1001"
				min=0.35
				name="举手空间留白"
				operand="y"
				type="diff"
				unsatisfied_msgstr="请后退或抬高手机，让镜头拍到举手"
			[/pose]
			[pose]
				abs=true
				landmarks="11,12; 23,24"
				min=0.23
				name="人物不能太小"
				operand="y"
				type="diff"
				unsatisfied_msgstr="请往前走一点，让身体在画面中更大一些"
			[/pose]
		[/track_pose]
		[task]
			max_count=5
			rule="strict"
			satisfied_threshold_s=3
			tone="full"
			type="time_counter"
		[/task]
		[next]
			[branch]
				do_bool_set="set_none"
				do_str=""
				do_to_state=2
				[judge]
					op="bool_equal"
					r_exp=true
					var_exp="$(is_wko_task_finished,)"
				[/judge]
			[/branch]
		[/next]
	[/state2]
	[state2]
		state="播放第一个动作要领"
		[task]
			msgstr="定位完成。开始第一个动作：十指相扣，手臂向上延展。抬头，眼睛看手臂，保持10秒"
			type="speak"
		[/task]
		[next]
			[branch]
				do_bool_set="set_none"
				do_str=""
				do_to_state=3
				[judge]
					op="bool_equal"
					r_exp=true
					var_exp="$(is_wko_task_finished,)"
				[/judge]
			[/branch]
		[/next]
	[/state2]
	[state2]
		action_tpl2_id="standing_clasp_stretch_time"
		state="第一个动作"
		[next]
			[branch]
				do_bool_set="set_none"
				do_str=""
				do_to_state=4
				[judge]
					op="bool_equal"
					r_exp=true
					var_exp="$(is_wko_task_finished,)"
				[/judge]
			[/branch]
		[/next]
	[/state2]
	[state2]
		state="播放第二个动作要领"
		[task]
			msgstr="结束动作，慢慢还原。第二个动作：双手在体前，交叉相抱，含胸，下颚向下贴胸骨。保持10秒。"
			type="speak"
		[/task]
		[next]
			[branch]
				do_bool_set="set_none"
				do_str=""
				do_to_state=5
				[judge]
					op="bool_equal"
					r_exp=true
					var_exp="$(is_wko_task_finished,)"
				[/judge]
			[/branch]
		[/next]
	[/state2]
	[state2]
		action_tpl2_id="cross_arm_neck_stretch_time"
		state="第二个动作"
		[next]
			[branch]
				do_bool_set="set_none"
				do_str=""
				do_to_state=6
				[judge]
					op="bool_equal"
					r_exp=true
					var_exp="$(is_wko_task_finished,)"
				[/judge]
			[/branch]
		[/next]
	[/state2]
	[state2]
		state="播放第三个动作第一拍要领"
		[task]
			msgstr="结束动作，慢慢还原。第三个动作：抬起右侧手臂，环绕头部，放在左侧太阳穴。把头部向右侧作牵拉，保持10秒。"
			type="speak"
		[/task]
		[next]
			[branch]
				do_bool_set="set_none"
				do_str=""
				do_to_state=7
				[judge]
					op="bool_equal"
					r_exp=true
					var_exp="$(is_wko_task_finished,)"
				[/judge]
			[/branch]
		[/next]
	[/state2]
	[state2]
		action_tpl2_id="neck_side_stretch_right_arm_down_time"
		state="第三个动作第一拍"
		unsatisfied_2th_msgstr="抬起右侧手臂，放在左侧太阳穴，把头部向右侧作牵拉"
		[next]
			[branch]
				do_bool_set="set_none"
				do_str=""
				do_to_state=8
				[judge]
					op="bool_equal"
					r_exp=true
					var_exp="$(is_wko_task_finished,)"
				[/judge]
			[/branch]
		[/next]
	[/state2]
	[state2]
		state="播放第三个动作第二拍要领"
		[task]
			msgstr="结束动作，慢慢还原。抬起左侧手臂，环绕头部，放右侧太阳穴。把头部向左侧作牵拉，保持10秒。"
			type="speak"
		[/task]
		[next]
			[branch]
				do_bool_set="set_none"
				do_str=""
				do_to_state=9
				[judge]
					op="bool_equal"
					r_exp=true
					var_exp="$(is_wko_task_finished,)"
				[/judge]
			[/branch]
		[/next]
	[/state2]
	[state2]
		action_tpl2_id="neck_side_stretch_left_arm_down_time"
		state="第三个动作第二拍"
		unsatisfied_2th_msgstr="抬起左侧手臂，放右侧太阳穴，把头部向左侧作牵拉"
		[next]
			[branch]
				do_bool_set="set_none"
				do_str=""
				do_to_state=10
				[judge]
					op="bool_equal"
					r_exp=true
					var_exp="$(is_wko_task_finished,)"
				[/judge]
			[/branch]
		[/next]
	[/state2]
	[state2]
		state="播放第四个动作要领"
		[task]
			msgstr="结束动作，慢慢还原。第四个动作：十指交叉，放在颈部后侧，同时两手肘向两侧展开，看向天花板。保持10秒"
			type="speak"
		[/task]
		[next]
			[branch]
				do_bool_set="set_none"
				do_str=""
				do_to_state=11
				[judge]
					op="bool_equal"
					r_exp=true
					var_exp="$(is_wko_task_finished,)"
				[/judge]
			[/branch]
		[/next]
	[/state2]
	[state2]
		action_tpl2_id="head_press_back_time"
		state="第四个动作"
		unsatisfied_2th_msgstr="十指交叉，放颈部后侧，两手肘向两侧展开，看向天花板"
		[next]
			[branch]
				do_bool_set="set_none"
				do_str=""
				do_to_state=12
				[judge]
					op="bool_equal"
					r_exp=true
					var_exp="$(is_wko_task_finished,)"
				[/judge]
			[/branch]
		[/next]
	[/state2]
	[state2]
		state="已结束"
		[task]
			msgstr="肩颈操，已结束。"
			repeat_s=10
			type="speak"
		[/task]
		[next]
		[/next]
	[/state2]
[/workout]
