[workout]
	author="中国军号"
	id="leagor_pelvictilt"
	name="矫正骨盆前倾"
	reference="https://www.bilibili.com/video/BV1kSbB6sEbz"
	version="1.0.1-20260903"
	[state2]
		state="播报开场1"
		[task]
			msgstr="矫正骨盆前倾训练。建议不要穿太宽松裤子，手机摆在右侧，镜头跟身体平行，对准肚脐附近，放好后，原地躺下，左手向后伸直，等待定位完成"
			type="speak"
		[/task]
		[next]
			[branch]
				do_bool_set="set_none"
				do_str=""
				do_to_state=1
				[judge]
					op="bool_equal"
					r_exp=true
					var_exp="$(is_wko_task_finished,)"
				[/judge]
			[/branch]
		[/next]
	[/state2]
	[state2]
		is_setup=true
		state="定位"
		unsatisfied_2th_threshold_s=5
		unsatisfied_threshold_ms=800
		[track_pose]
			[pose]
				landmarks="11; 27"
				min=0.05
				name="画面方向确认"
				operand="x"
				type="diff"
				unsatisfied_msgstr="请掉转方向，让头在画面右侧"
			[/pose]
			[pose]
				landmarks="11; 13"
				max=25
				min=-90
				name="左上臂角度"
				operand="point"
				type="angle2p"
				unsatisfied_msgstr="左侧上臂太朝上，请向后贴地伸平"
			[/pose]
			[pose]
				landmarks="11; 13; 15"
				min=155
				name="左手肘角度"
				operand="point"
				type="angle3p"
				unsatisfied_msgstr="左手肘太弯曲，请伸直"
			[/pose]
			[pose]
				landmarks="11; 23; 25"
				min=155
				name="身体平直度（肩→髋→膝）"
				operand="point"
				type="angle3p"
				unsatisfied_msgstr="身体未完全伸直，请将身体撑成一条直线"
			[/pose]
			[pose]
				abs=true
				landmarks="11; 27"
				max=0.52
				min=0.35
				name="全身画面占比"
				operand="x"
				type="diff"
				unsatisfied_msgstr="靠近或拉近镜头，别太小"
				unsatisfied_rmax_msgstr="后退或推远镜头，别太大"
			[/pose]
			[pose]
				landmarks="23; 1000"
				max=0.15
				min=-0.15
				name="左髋水平居中"
				operand="x"
				type="diff"
				unsatisfied_msgstr="往头侧移动，或反向移手机"
				unsatisfied_rmax_msgstr="往脚侧移动，或反向移手机"
			[/pose]
			[pose]
				landmarks="1002; 15"
				min=0.15
				name="(左)伸手空间留白"
				operand="x"
				type="diff"
				unsatisfied_msgstr="身体往脚侧移点，确保后伸手不超出画面"
			[/pose]
			[pose]
				landmarks="27,28; 1001"
				min=0.4
				name="(上)抬脚空间留白"
				operand="y"
				type="diff"
				unsatisfied_msgstr="太靠上了，会不够伸脚空间，请往后退，或抬高手机"
			[/pose]
		[/track_pose]
		[task]
			max_count=5
			rule="strict"
			satisfied_threshold_s=3
			tone="full"
			type="time_counter"
		[/task]
		[next]
			[branch]
				do_bool_set="set_none"
				do_str=""
				do_to_state=2
				[judge]
					op="bool_equal"
					r_exp=true
					var_exp="$(is_wko_task_finished,)"
				[/judge]
			[/branch]
		[/next]
	[/state2]
	[state2]
		state="第1个动作开场"
		[task]
			msgstr="定位完成，第1个动作，仰卧屈膝，臀部与脚跟一掌距离，双脚打开，与肩同宽，用臀部发力，开始"
			type="speak"
		[/task]
		[next]
			[branch]
				do_bool_set="set_none"
				do_str=""
				do_to_state=3
				[judge]
					op="bool_equal"
					r_exp=true
					var_exp="$(is_wko_task_finished,)"
				[/judge]
			[/branch]
		[/next]
	[/state2]
	[state2]
		state="仰卧屈膝"
		unsatisfied_2th_threshold_s=3
		unsatisfied_threshold_ms=800
		[track_pose]
			[pose]
				landmarks="11; 23"
				max=195
				min=165
				name="躯干左侧角（肩→髋）"
				operand="point"
				type="angle2p"
				unsatisfied_msgstr="腰离地了，请压实垫子"
				unsatisfied_rmax_msgstr="肩离地了，肩膀落回垫子"
			[/pose]
			[pose]
				landmarks="11; 13"
				max=270
				min=160
				name="左上臂角度"
				operand="point"
				phase_mask=3
				type="angle2p"
				unsatisfied_msgstr="左侧上臂抬起来了，请向下贴地"
				unsatisfied_rmax_msgstr="左侧上臂太朝下，向上些"
			[/pose]
			[pose]
				landmarks="23; 25; 27"
				max=53
				min=20
				name="左膝弯曲角"
				operand="point"
				type="angle3p"
				unsatisfied_msgstr="双脚太靠近屁股了，往脚尖方向踩远一点"
				unsatisfied_rmax_msgstr="双脚太远了，往屁股方向收近一点。"
			[/pose]
			[pose]
				ang_range="360"
				landmarks="11; 23; 25"
				max=185
				min=150
				name="身体平直度（肩→髋→膝）"
				operand="point"
				phase_mask=2
				type="angle3p"
				unsatisfied_msgstr="请用力顶高，让身体成一条直线"
				unsatisfied_rmax_msgstr="顶太高反弓了，往下放一点"
			[/pose]
			[pose]
				landmarks="23; 25; 27"
				max=70
				min=50
				name="左膝弯曲角"
				operand="point"
				phase_mask=2
				type="angle3p"
				unsatisfied_msgstr="双脚太靠近屁股了，往脚尖方向踩远一点"
				unsatisfied_rmax_msgstr="左腿放太远了，往屁股方向收一点"
			[/pose]
		[/track_pose]
		[task]
			max_count=10
			type="rep_counter"
			[phase]
				action_msg="放下"
				cooldowned_ms=600
				min_duration_ms=1000
			[/phase]
			[phase]
				action_msg="顶起"
				cooldowned_ms=500
				min_duration_ms=1600
			[/phase]
		[/task]
		[next]
			[branch]
				do_bool_set="set_none"
				do_str=""
				do_to_state=4
				[judge]
					op="bool_equal"
					r_exp=true
					var_exp="$(is_wko_task_finished,)"
				[/judge]
			[/branch]
		[/next]
	[/state2]
	[state2]
		state="第2个动场开场"
		[task]
			msgstr="第2个动作，死虫式，屁股向脚尖方向微微滑动，把腰压平贴地，抬左脚，举右手，开始"
			type="speak"
		[/task]
		[next]
			[branch]
				do_bool_set="set_none"
				do_str=""
				do_to_state=5
				[judge]
					op="bool_equal"
					r_exp=true
					var_exp="$(is_wko_task_finished,)"
				[/judge]
			[/branch]
		[/next]
	[/state2]
	[state2]
		state="死虫式"
		unsatisfied_2th_threshold_s=3
		unsatisfied_threshold_ms=800
		[track_pose]
			[pose]
				landmarks="11; 13"
				max=25
				min=-90
				name="左上臂角度"
				operand="point"
				type="angle2p"
				unsatisfied_msgstr="左侧上臂太朝上，向下些"
			[/pose]
			[pose]
				landmarks="11; 13; 15"
				min=155
				name="左手肘角度"
				operand="point"
				type="angle3p"
				unsatisfied_msgstr="左手肘太弯曲，伸直些"
			[/pose]
			[pose]
				landmarks="11; 23"
				max=190
				min=165
				name="躯干左侧角（肩→髋）"
				operand="point"
				phase_mask=2
				type="angle2p"
				unsatisfied_msgstr="腰离地了，请压实垫子"
				unsatisfied_rmax_msgstr="肩离地了，肩膀落回垫子"
			[/pose]
			[pose]
				landmarks="23; 25"
				max=95
				min=75
				name="左侧大腿角度"
				operand="point"
				type="angle2p"
				unsatisfied_msgstr="左大腿太靠近头部，膝盖向脚尖方向移"
				unsatisfied_rmax_msgstr="左大腿太靠近脚尖，膝盖往头部方向收。"
			[/pose]
			[pose]
				landmarks="25; 27"
				max=195
				min=165
				name="左小腿角度"
				operand="point"
				type="angle2p"
				unsatisfied_msgstr="左小腿太翘了，脚尖向脚后跟方向放平"
				unsatisfied_rmax_msgstr="左小腿掉下去了，小腿往上抬一点"
			[/pose]
			[pose]
				landmarks="24; 26"
				max=195
				min=155
				name="右侧大腿角度"
				operand="point"
				type="angle2p"
				unsatisfied_msgstr="右腿太翘了，向下压些，伸直，并保持悬空"
				unsatisfied_rmax_msgstr="右腿太向下了，向上抬些，伸直，并保持悬空"
			[/pose]
			[pose]
				landmarks="11; 13"
				max=100
				min=80
				name="左上臂角度"
				operand="point"
				phase_mask=2
				type="angle2p"
				unsatisfied_msgstr="左侧上臂歪了，往脚尖方向移些"
				unsatisfied_rmax_msgstr="左侧上臂歪了，往头部方向移些"
			[/pose]
			[pose]
				landmarks="11; 13; 15"
				min=160
				name="左手肘角度"
				operand="point"
				phase_mask=2
				type="angle3p"
				unsatisfied_msgstr="左手肘太弯曲，伸直些"
			[/pose]
			[pose]
				landmarks="23; 25"
				max=195
				min=155
				name="左侧大腿角度"
				operand="point"
				phase_mask=2
				type="angle2p"
				unsatisfied_msgstr="左腿太翘了，向下压些，伸直，并保持悬空"
				unsatisfied_rmax_msgstr="左腿太朝下，向上抬些，伸直，并保持悬空"
			[/pose]
			[pose]
				landmarks="24; 26"
				max=100
				min=80
				name="右侧大腿角度"
				operand="point"
				phase_mask=2
				type="angle2p"
				unsatisfied_msgstr="右大腿太靠近头部，膝盖向脚尖方向移"
				unsatisfied_rmax_msgstr="右大腿太靠近脚尖，膝盖往头部方向收"
			[/pose]
			[pose]
				landmarks="26; 28"
				max=195
				min=165
				name="右小腿角度"
				operand="point"
				phase_mask=2
				type="angle2p"
				unsatisfied_msgstr="右小腿太翘了，脚尖往下放平"
				unsatisfied_rmax_msgstr="右小腿掉下去了，往上抬一点"
			[/pose]
		[/track_pose]
		[task]
			max_count=10
			type="rep_counter"
			[phase]
				action_msg="抬左脚"
				cooldowned_ms=1200
				min_duration_ms=1600
			[/phase]
			[phase]
				action_msg="抬右脚"
				cooldowned_ms=1200
				min_duration_ms=1600
			[/phase]
		[/task]
		[next]
			[branch]
				do_bool_set="set_none"
				do_str=""
				do_to_state=6
				[judge]
					op="bool_equal"
					r_exp=true
					var_exp="$(is_wko_task_finished,)"
				[/judge]
			[/branch]
		[/next]
	[/state2]
	[state2]
		state="已结束"
		[task]
			msgstr="矫正骨盆前倾，已结束。"
			repeat_s=10
			type="speak"
		[/task]
		[next]
		[/next]
	[/state2]
[/workout]
