[workout]
	id="leagor_plank_90s"
	name="平板撑90秒"
	version="1.0.1-20260823"
	[state2]
		state="播报开场和定位"
		[task]
			msgstr="平板撑训练。手机摆在右侧，镜头跟身体平行，对准肚脐附近，放好手机后，原地趴下，保持不动，等待定位完成"
			type="speak"
		[/task]
		[next]
			[branch]
				do_bool_set="set_none"
				do_str=""
				do_to_state=1
				[judge]
					op="bool_equal"
					r_exp=true
					var_exp="$(is_wko_task_finished,)"
				[/judge]
			[/branch]
		[/next]
	[/state2]
	[state2]
		is_setup=true
		state="定位"
		unsatisfied_2th_threshold_s=5
		unsatisfied_threshold_ms=800
		[track_pose]
			[pose]
				landmarks="12; 28"
				min=0.05
				name="画面方向确认"
				operand="x"
				type="diff"
				unsatisfied_msgstr="请掉转方向，让头在画面右侧"
			[/pose]
			[pose]
				landmarks="24; 1000"
				max=0.15
				min=-0.15
				name="右髋水平居中"
				operand="x"
				type="diff"
				unsatisfied_msgstr="往头侧移动，或反向移手机"
				unsatisfied_rmax_msgstr="往脚侧移动，或反向移手机"
			[/pose]
			[pose]
				abs=true
				landmarks="12; 28"
				max=0.65
				min=0.25
				name="全身画面占比"
				operand="x"
				type="diff"
				unsatisfied_msgstr="靠近或拉近镜头，别太小"
				unsatisfied_rmax_msgstr="后退或推远镜头，别太大"
			[/pose]
		[/track_pose]
		[task]
			max_count=5
			rule="strict"
			satisfied_threshold_s=3
			tone="full"
			type="time_counter"
		[/task]
		[next]
			[branch]
				do_bool_set="set_none"
				do_str=""
				do_to_state=2
				[judge]
					op="bool_equal"
					r_exp=true
					var_exp="$(is_wko_task_finished,)"
				[/judge]
			[/branch]
		[/next]
	[/state2]
	[state2]
		state="播报开始"
		[task]
			msgstr="定位完成，开始平板撑"
			type="speak"
		[/task]
		[next]
			[branch]
				do_bool_set="set_none"
				do_str=""
				do_to_state=3
				[judge]
					op="bool_equal"
					r_exp=true
					var_exp="$(is_wko_task_finished,)"
				[/judge]
			[/branch]
		[/next]
	[/state2]
	[state2]
		state="平板撑"
		unsatisfied_2th_threshold_s=5
		unsatisfied_threshold_ms=1500
		[track_pose]
			[pose]
				landmarks="14; 16"
				max=30
				min=-30
				name="右前臂角度"
				operand="point"
				type="angle2p"
				unsatisfied_msgstr="前臂太上抬，请保持与地面平行"
				unsatisfied_rmax_msgstr="前臂太下垂，请保持与地面平行"
			[/pose]
			[pose]
				landmarks="12; 14"
				max=280
				min=260
				name="右上臂角度"
				operand="point"
				type="angle2p"
				unsatisfied_msgstr="手肘弯曲太小，身体向后移一些"
				unsatisfied_rmax_msgstr="手肘弯曲太大，身体向前移一些"
			[/pose]
			[pose]
				landmarks="12; 24; 26"
				min=155
				name="身体平直度（肩→髋→膝）"
				operand="point"
				type="angle3p"
				unsatisfied_msgstr="身体未完全伸直，请将身体撑成一条直线"
			[/pose]
			[pose]
				landmarks="12; 24"
				max=190
				min=170
				name="躯干右侧角（肩→髋）"
				operand="point"
				type="angle2p"
				unsatisfied_msgstr="有撅臀，请向下压腰"
				unsatisfied_rmax_msgstr="有塌腰，请向上顶腰"
			[/pose]
			[pose]
				landmarks="24; 26"
				max=210
				min=170
				name="右侧大腿角度（髋→膝）"
				operand="point"
				type="angle2p"
				unsatisfied_msgstr="膝盖太高，放低一些"
				unsatisfied_rmax_msgstr="膝盖太低，抬高一些。"
			[/pose]
		[/track_pose]
		[task]
			max_count=90
			rule="satisfied"
			satisfied_threshold_s=3
			tone="split"
			type="time_counter"
		[/task]
		[next]
			[branch]
				do_bool_set="set_none"
				do_str=""
				do_to_state=4
				[judge]
					op="bool_equal"
					r_exp=true
					var_exp="$(is_wko_task_finished,)"
				[/judge]
			[/branch]
		[/next]
	[/state2]
	[state2]
		state="已结束"
		[task]
			msgstr="平板撑，已结束。"
			repeat_s=10
			type="speak"
		[/task]
		[next]
		[/next]
	[/state2]
[/workout]
