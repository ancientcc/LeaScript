[workout]
	id="leagor_pushup_15"
	name="俯卧撑15个"
	version="1.0.1-20260811"
	[state2]
		state="播报开场"
		[task]
			msgstr="俯卧撑训练。手机摆在右侧，镜头跟身体平行，放好手机后，原地趴下，做出手臂伸直的到最高点姿势，等待定位完成"
			type="speak"
		[/task]
		[next]
			[branch]
				do_bool_set="set_none"
				do_str=""
				do_to_state=1
				[judge]
					op="bool_equal"
					r_exp=true
					var_exp="$(is_wko_task_finished,)"
				[/judge]
			[/branch]
		[/next]
	[/state2]
	[state2]
		is_setup=true
		state="定位"
		unsatisfied_2th_threshold_s=5
		unsatisfied_threshold_ms=800
		[track_pose]
			[pose]
				landmarks="12; 28"
				min=0.05
				name="画面方向确认"
				operand="x"
				type="diff"
				unsatisfied_msgstr="请掉转方向，让头在画面右侧"
			[/pose]
			[pose]
				landmarks="12; 1000"
				max=0.15
				min=-0.15
				name="右肩水平居中"
				operand="x"
				type="diff"
				unsatisfied_msgstr="往头侧移动，或反向移手机"
				unsatisfied_rmax_msgstr="往脚侧移动，或反向移手机"
			[/pose]
			[pose]
				abs=true
				landmarks="12; 28"
				max=0.65
				min=0.25
				name="全身画面占比"
				operand="x"
				type="diff"
				unsatisfied_msgstr="靠近或拉近镜头，别太小"
				unsatisfied_rmax_msgstr="后退或推远镜头，别太大"
			[/pose]
		[/track_pose]
		[task]
			max_count=5
			rule="strict"
			satisfied_threshold_s=3
			tone="full"
			type="time_counter"
		[/task]
		[next]
			[branch]
				do_bool_set="set_none"
				do_str=""
				do_to_state=2
				[judge]
					op="bool_equal"
					r_exp=true
					var_exp="$(is_wko_task_finished,)"
				[/judge]
			[/branch]
		[/next]
	[/state2]
	[state2]
		state="播报开始"
		[task]
			msgstr="定位完成，请做标准俯卧撑，开始"
			type="speak"
		[/task]
		[next]
			[branch]
				do_bool_set="set_none"
				do_str=""
				do_to_state=3
				[judge]
					op="bool_equal"
					r_exp=true
					var_exp="$(is_wko_task_finished,)"
				[/judge]
			[/branch]
		[/next]
	[/state2]
	[state2]
		state="做15个俯卧撑"
		unsatisfied_2th_threshold_s=4
		unsatisfied_threshold_ms=1200
		[track_pose]
			[pose]
				landmarks="12; 24; 26"
				legend="身体不平直（肩→髋→膝）"
				min=160
				name="身体平直度（肩→髋→膝）"
				operand="point"
				type="angle3p"
				unsatisfied_msgstr="让肩髋膝，呈一条直线"
			[/pose]
			[pose]
				landmarks="12; 14"
				max=175
				min=110
				name="右上臂角度"
				operand="point"
				type="angle2p"
				unsatisfied_msgstr="身体沉太低了，撑高点"
				unsatisfied_rmax_msgstr="身体抬太高了，放低点"
			[/pose]
			[pose]
				landmarks="14; 16"
				max=280
				min=260
				name="右前臂角度"
				operand="point"
				type="angle2p"
				unsatisfied_msgstr="前臂太向后，身体向后移一些"
				unsatisfied_rmax_msgstr="前臂太向前，身体向前移一些"
			[/pose]
			[pose]
				landmarks="12; 24"
				max=205
				min=165
				name="骨盆倾斜度（肩→髋）"
				operand="point"
				type="angle2p"
				unsatisfied_msgstr="有塌腰，请向上顶腰"
				unsatisfied_rmax_msgstr="有撅臀，请向下压腰"
			[/pose]
			[pose]
				landmarks="24; 26"
				max=205
				min=165
				name="下肢倾斜度（髋→膝）"
				operand="point"
				type="angle2p"
				unsatisfied_msgstr="膝部比腰高，请将膝盖向地面压低"
				unsatisfied_rmax_msgstr="膝部比腰低，请抬起膝盖，保持下肢平直"
			[/pose]
			[pose]
				landmarks="12; 24; 26"
				min=160
				name="(高点)身体平直度（肩→髋→膝）"
				operand="point"
				phase_mask=2
				type="angle3p"
				unsatisfied_msgstr="让肩髋膝，呈一条直线"
			[/pose]
			[pose]
				landmarks="12; 14; 16"
				min=165
				name="(高点)手臂伸直度（肘关节）"
				operand="point"
				phase_mask=2
				type="angle3p"
				unsatisfied_msgstr="手臂完全伸直"
			[/pose]
		[/track_pose]
		[task]
			max_count=15
			type="rep_counter"
			[phase]
				action_msg="向下"
				cooldowned_ms=300
				min_duration_ms=800
			[/phase]
			[phase]
				action_msg="向上"
				cooldowned_ms=150
				min_duration_ms=200
			[/phase]
		[/task]
		[next]
			[branch]
				do_bool_set="set_none"
				do_str=""
				do_to_state=4
				[judge]
					op="bool_equal"
					r_exp=true
					var_exp="$(is_wko_task_finished,)"
				[/judge]
			[/branch]
		[/next]
	[/state2]
	[state2]
		state="已结束"
		[task]
			msgstr="俯卧撑，已结束。"
			repeat_s=10
			type="speak"
		[/task]
		[next]
		[/next]
	[/state2]
[/workout]
