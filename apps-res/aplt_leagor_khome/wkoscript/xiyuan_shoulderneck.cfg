[workout]
	author="西苑医院"
	id="xiyuan_shoulderneck"
	reference="https://www.bilibili.com/video/BV188gr6FEeV"
	title="肩颈操(西苑.2侧颈)"
	version="1.0.1-20260903"
	[state2]
		state="播报开场和定位"
		[task]
			msgstr="西苑版肩颈操训练。请将手机放正前方。摆好手机后，请站到画面中央，靠墙，保持身体正对镜头，等待定位完成。"
			type="speak"
		[/task]
		[next]
			[branch]
				do_bool_set="set_none"
				do_str=""
				do_to_state=1
				[judge]
					op="bool_equal"
					r_exp=true
					var_exp="$(is_wko_task_finished,)"
				[/judge]
			[/branch]
		[/next]
	[/state2]
	[state2]
		is_setup=true
		state="定位"
		unsatisfied_2th_threshold_s=5
		unsatisfied_threshold_ms=800
		[track_pose]
			[pose]
				landmarks="11,12; 23,24"
				max=275
				min=265
				name="身体歪斜角度"
				operand="point"
				type="angle2p"
				unsatisfied_msgstr="身体不要太歪"
			[/pose]
			[pose]
				landmarks="11,12; 1000"
				max=0.15
				min=-0.15
				name="水平居中"
				operand="x"
				type="diff"
				unsatisfied_msgstr="请往左边平移，靠近摄像头中心"
				unsatisfied_rmax_msgstr="请往右边平移，靠近摄像头中心"
			[/pose]
			[pose]
				landmarks="11,12; 1001"
				min=0.35
				name="举手空间留白"
				operand="y"
				type="diff"
				unsatisfied_msgstr="请后退或抬高手机，让镜头拍到举手"
			[/pose]
			[pose]
				abs=true
				landmarks="11,12; 23,24"
				min=0.23
				name="人物不能太小"
				operand="y"
				type="diff"
				unsatisfied_msgstr="请往前走一点，让身体在画面中更大一些"
			[/pose]
		[/track_pose]
		[task]
			max_count=5
			rule="strict"
			satisfied_threshold_s=3
			tone="full"
			type="time_counter"
		[/task]
		[next]
			[branch]
				do_bool_set="set_none"
				do_str=""
				do_to_state=2
				[judge]
					op="bool_equal"
					r_exp=true
					var_exp="$(is_wko_task_finished,)"
				[/judge]
			[/branch]
		[/next]
	[/state2]
	[state2]
		state="(#1)播报第1个动作第1拍要领"
		[task]
			msgstr="定位完成。第1个动作：左手放于后腰，固定肩膀；抬起右侧手臂，放在左侧太阳穴。把头部向右侧作牵拉，开始"
			type="speak"
		[/task]
		[next]
			[branch]
				do_bool_set="set_none"
				do_str=""
				do_to_state=3
				[judge]
					op="bool_equal"
					r_exp=true
					var_exp="$(is_wko_task_finished,)"
				[/judge]
			[/branch]
		[/next]
	[/state2]
	[state2]
		action_tpl2_id="neck_side_stretch_right_arm_back_time"
		state="(#1)第1个动作第1拍"
		[next]
			[branch]
				do_bool_set="set_none"
				do_str=""
				do_to_state=4
				[judge]
					op="bool_equal"
					r_exp=true
					var_exp="$(is_wko_task_finished,)"
				[/judge]
			[/branch]
		[/next]
	[/state2]
	[state2]
		state="(#1)播报第1个动作第2拍要领"
		[task]
			msgstr="结束动作，慢慢还原。右手放于后腰，固定肩膀；抬起左侧手臂，放右侧太阳穴。把头部向左侧作牵拉，开始"
			type="speak"
		[/task]
		[next]
			[branch]
				do_bool_set="set_none"
				do_str=""
				do_to_state=5
				[judge]
					op="bool_equal"
					r_exp=true
					var_exp="$(is_wko_task_finished,)"
				[/judge]
			[/branch]
		[/next]
	[/state2]
	[state2]
		action_tpl2_id="neck_side_stretch_left_arm_back_time"
		state="(#1)第1个动作第2拍"
		[next]
			[branch]
				do_bool_set="set_none"
				do_str=""
				do_to_state=6
				[judge]
					op="bool_equal"
					r_exp=true
					var_exp="$(is_wko_task_finished,)"
				[/judge]
			[/branch]
		[/next]
	[/state2]
	[state2]
		state="(#2)播报第1个动作第1拍要领"
		[task]
			msgstr="结束动作，慢慢还原。从复第1个动作。左手放于后腰，抬右侧手臂，把头部向右侧作牵拉，开始"
			type="speak"
		[/task]
		[next]
			[branch]
				do_bool_set="set_none"
				do_str=""
				do_to_state=7
				[judge]
					op="bool_equal"
					r_exp=true
					var_exp="$(is_wko_task_finished,)"
				[/judge]
			[/branch]
		[/next]
	[/state2]
	[state2]
		action_tpl2_id="neck_side_stretch_right_arm_back_time"
		state="(#2)第1个动作第1拍"
		[next]
			[branch]
				do_bool_set="set_none"
				do_str=""
				do_to_state=8
				[judge]
					op="bool_equal"
					r_exp=true
					var_exp="$(is_wko_task_finished,)"
				[/judge]
			[/branch]
		[/next]
	[/state2]
	[state2]
		state="(#2)播报第1个动作第2拍要领"
		[task]
			msgstr="结束动作，慢慢还原。右手放于后腰，抬左侧手臂，把头部向左侧作牵拉，开始"
			type="speak"
		[/task]
		[next]
			[branch]
				do_bool_set="set_none"
				do_str=""
				do_to_state=9
				[judge]
					op="bool_equal"
					r_exp=true
					var_exp="$(is_wko_task_finished,)"
				[/judge]
			[/branch]
		[/next]
	[/state2]
	[state2]
		action_tpl2_id="neck_side_stretch_left_arm_back_time"
		state="(#2)第1个动作第2拍"
		[next]
			[branch]
				do_bool_set="set_none"
				do_str=""
				do_to_state=10
				[judge]
					op="bool_equal"
					r_exp=true
					var_exp="$(is_wko_task_finished,)"
				[/judge]
			[/branch]
		[/next]
	[/state2]
	[state2]
		state="第2个动作开场"
		[task]
			msgstr="结束动作，慢慢还原。第2个动作，背靠墙站立，后脑勺、背部、臀部贴近墙面，双臂屈肘90度贴近墙面，第二阶段时缓慢上举，开始"
			type="speak"
		[/task]
		[next]
			[branch]
				do_bool_set="set_none"
				do_str=""
				do_to_state=11
				[judge]
					op="bool_equal"
					r_exp=true
					var_exp="$(is_wko_task_finished,)"
				[/judge]
			[/branch]
		[/next]
	[/state2]
	[state2]
		action_tpl2_id="wall_angel_slide_rep"
		state="靠墙天使"
		[next]
			[branch]
				do_bool_set="set_none"
				do_str=""
				do_to_state=12
				[judge]
					op="bool_equal"
					r_exp=true
					var_exp="$(is_wko_task_finished,)"
				[/judge]
			[/branch]
		[/next]
	[/state2]
	[state2]
		state="已结束"
		[task]
			msgstr="肩颈操，已结束。"
			repeat_s=10
			type="speak"
		[/task]
		[next]
		[/next]
	[/state2]
[/workout]
