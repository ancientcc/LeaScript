#textdomain aplt_leagor_khomelua-lib

[window]
	app="aplt_leagor_khomelua"
	id="home"
	[resolution]
		{GUI__COMMON_FLOAT_WIDGETS}
		automatic_placement=false
		definition="scale_screen"
		height="(screen_height)"
		width="(screen_width)"
		x="(0)"
		y="(0)"
		[grid]
			[row]
				[column]
					horizontal_alignment="edge"
					[panel]
						definition="default"
						label="misc/bg_ffffff.png"
						[grid]
							[row]
								[column]
									[spacer]
										definition="default"
										height="(statusbar_height)"
									[/spacer]
								[/column]
							[/row]
							[row]
								[column]
									horizontal_alignment="edge"
									[grid]
										[row]
											[column]
												[spacer]
													definition="default"
													width="(72)"
												[/spacer]
											[/column]
											[column]
												grow_factor=1
												[label]
													definition="default"
													id="title"
													text_font_size=1001
												[/label]
											[/column]
											[column]
												[rose__aplt]
													id="aplt"
												[/rose__aplt]
											[/column]
										[/row]
									[/grid]
								[/column]
							[/row]
							[row]
								[column]
									[spacer]
										definition="default"
									[/spacer]
								[/column]
							[/row]
						[/grid]
					[/panel]
				[/column]
			[/row]
			[row]
				grow_factor=1
				[column]
					border="left, right"
					border_size=8
					horizontal_alignment="edge"
					vertical_alignment="edge"
					[stack]
						definition="default"
						id="body"
						mode="radio"
						[layer]
							[row]
								[column]
									border="top"
									border_size=8
									horizontal_alignment="edge"
									vertical_alignment="edge"
									[listbox]
										definition="default"
										height="(0)"
										horizontal_scrollbar_mode="never"
										id="wkofile_list"
										width="(0)"
										[list_definition]
											[row]
												[column]
													[toggle_panel]
														definition="default"
														[grid]
															[row]
																[column]
																	horizontal_alignment="edge"
																	[grid]
																		[row]
																			[column]
																				grow_factor=1
																				horizontal_alignment="edge"
																				[grid]
																					[row]
																						[column]
																							horizontal_alignment="left"
																							[label]
																								definition="default"
																								id="name"
																								mtwusc=true
																							[/label]
																						[/column]
																					[/row]
																					[row]
																						[column]
																							horizontal_alignment="left"
																							[label]
																								definition="default"
																								id="file"
																								mtwusc=true
																								state=1
																								text_font_size=999
																							[/label]
																						[/column]
																					[/row]
																				[/grid]
																			[/column]
																			[column]
																				[button]
																					definition="vertical_node"
																					id="open_url"
																					label=_"Open demo"
																				[/button]
																			[/column]
																		[/row]
																	[/grid]
																[/column]
															[/row]
															[row]
																[column]
																	border="top, bottom"
																	border_size=4
																	horizontal_alignment="edge"
																	[image]
																		definition="default"
																		label="misc/split_line.png"
																	[/image]
																[/column]
															[/row]
														[/grid]
													[/toggle_panel]
												[/column]
											[/row]
										[/list_definition]
									[/listbox]
								[/column]
							[/row]
						[/layer]
						[layer]
							[row]
								[column]
									horizontal_alignment="left"
									vertical_alignment="bottom"
									[label]
										definition="default"
										id="version"
										mtwusc=true
										state=1
										text_font_size=999
									[/label]
								[/column]
							[/row]
						[/layer]
					[/stack]
				[/column]
			[/row]
			[row]
				[column]
					horizontal_alignment="edge"
					[image]
						definition="default"
						label="misc/split_line.png"
					[/image]
				[/column]
			[/row]
			[row]
				[column]
					border="left, right"
					border_size=8
					horizontal_alignment="edge"
					[report]
						definition="default"
						fixed_cols=2
						horizontal_scrollbar_mode="never"
						id="navigation"
						multi_line=true
						toggle=true
						unit_definition="vertical_node"
						unit_height="(0)"
						unit_width="(0)"
					[/report]
				[/column]
			[/row]
			[row]
				[column]
					[spacer]
						definition="default"
						height="(corner_height)"
					[/spacer]
				[/column]
			[/row]
		[/grid]
	[/resolution]
[/window]
