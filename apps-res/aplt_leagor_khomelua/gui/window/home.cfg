#textdomain aplt_leagor_khomelua-lib

[window]
	app="aplt_leagor_khomelua"
	id="home"
	[resolution]
		{GUI__COMMON_FLOAT_WIDGETS}
		automatic_placement=false
		definition="scale_screen"
		height="(screen_height)"
		width="(screen_width)"
		x="(0)"
		y="(0)"
		[grid]
			[row]
				[column]
					horizontal_alignment="edge"
					[panel]
						definition="default"
						label="misc/bg_ffffff.png"
						[grid]
							[row]
								[column]
									[spacer]
										definition="default"
										height="(statusbar_height)"
									[/spacer]
								[/column]
							[/row]
							[row]
								[column]
									horizontal_alignment="edge"
									[grid]
										[row]
											[column]
												[spacer]
													definition="default"
													width="(72)"
												[/spacer]
											[/column]
											[column]
												grow_factor=1
												[label]
													definition="default"
													id="title"
													text_font_size=1001
												[/label]
											[/column]
											[column]
												[rose__aplt]
													id="aplt"
												[/rose__aplt]
											[/column]
										[/row]
									[/grid]
								[/column]
							[/row]
							[row]
								[column]
									[spacer]
										definition="default"
									[/spacer]
								[/column]
							[/row]
						[/grid]
					[/panel]
				[/column]
			[/row]
			[row]
				grow_factor=1
				[column]
					border="left, right"
					border_size=8
					horizontal_alignment="edge"
					vertical_alignment="edge"
					[stack]
						definition="default"
						id="body"
						mode="radio"
						[layer]
							id="course_layer"
							[row]
								[column]
									horizontal_alignment="edge"
									[report]
										definition="default"
										gap=16
										horizontal_scrollbar_mode="never"
										id="course_report"
										toggle=true
										unit_definition="text"
										unit_height="(0)"
										unit_width="(0)"
										width="(0)"
									[/report]
								[/column]
							[/row]
							[row]
								[column]
									horizontal_alignment="edge"
									[panel]
										bottom_margin=0
										definition="default"
										label="misc/bg_f3f3f3.png"
										left_margin=0
										right_margin=0
										top_margin=0
										[grid]
											[row]
												[column]
													grow_factor=1
													horizontal_alignment="edge"
													[grid]
														[row]
															[column]
																border="top"
																border_size=8
																horizontal_alignment="left"
																[label]
																	definition="default"
																	id="description"
																	mtwusc=true
																	text_font_size=999
																[/label]
															[/column]
														[/row]
														[row]
															[column]
																horizontal_alignment="left"
																[label]
																	definition="default"
																	id="enroll"
																	mtwusc=true
																	state=1
																	text_font_size=999
																[/label]
															[/column]
														[/row]
														[row]
															[column]
																border="top"
																border_size=8
																horizontal_alignment="left"
																[grid]
																	id="purchase_grid"
																	[row]
																		[column]
																			[image]
																				definition="default"
																				height="(24)"
																				id="currency"
																				label="misc/cny.png"
																				width="(24)"
																			[/image]
																		[/column]
																		[column]
																			border="right"
																			border_size=16
																			horizontal_alignment="left"
																			[label]
																				definition="default"
																				id="price"
																				text_font_size=1002
																			[/label]
																		[/column]
																		[column]
																			[button]
																				definition="default"
																				id="purchase"
																				label=_"Purchase"
																				text_color_tpl=1
																			[/button]
																		[/column]
																	[/row]
																[/grid]
															[/column]
														[/row]
													[/grid]
												[/column]
												[column]
													[button]
														definition="vertical_node"
														id="course_reference"
														label=_"Open coure reference"
													[/button]
												[/column]
											[/row]
										[/grid]
									[/panel]
								[/column]
							[/row]
							[row]
								[column]
									border="top"
									border_size=8
									horizontal_alignment="edge"
									[report]
										definition="default"
										gap=16
										horizontal_scrollbar_mode="never"
										id="day_segment_report"
										toggle=true
										unit_definition="text"
										unit_height="(0)"
										unit_width="(0)"
										width="(0)"
									[/report]
								[/column]
							[/row]
							[row]
								grow_factor=1
								[column]
									horizontal_alignment="edge"
									vertical_alignment="edge"
									[listbox]
										definition="default"
										height="(0)"
										horizontal_scrollbar_mode="never"
										id="day_list"
										width="(0)"
										[list_definition]
											[row]
												[column]
													[toggle_panel]
														definition="default"
														[grid]
															[row]
																[column]
																	horizontal_alignment="edge"
																	[grid]
																		id="day_grid"
																		[row]
																			[column]
																				border="right"
																				border_size=8
																				[label]
																					definition="default"
																					id="day"
																					text_font_size=1001
																				[/label]
																			[/column]
																			[column]
																				grow_factor=1
																				[label]
																					definition="default"
																					id="day_title"
																					mtwusc=true
																					state=1
																				[/label]
																			[/column]
																		[/row]
																	[/grid]
																[/column]
															[/row]
															[row]
																[column]
																	horizontal_alignment="edge"
																	[grid]
																		id="workout_grid"
																		[row]
																			[column]
																				grow_factor=1
																				horizontal_alignment="edge"
																				[grid]
																					[row]
																						[column]
																							horizontal_alignment="left"
																							[label]
																								definition="default"
																								id="name"
																								mtwusc=true
																								state=1
																							[/label]
																						[/column]
																					[/row]
																					[row]
																						[column]
																							horizontal_alignment="left"
																							[label]
																								definition="default"
																								id="note"
																								mtwusc=true
																								state=1
																								text_font_size=999
																							[/label]
																						[/column]
																					[/row]
																					[row]
																						[column]
																							horizontal_alignment="left"
																							[label]
																								definition="default"
																								id="file"
																								mtwusc=true
																								state=1
																								text_font_size=999
																							[/label]
																						[/column]
																					[/row]
																				[/grid]
																			[/column]
																			[column]
																				[button]
																					definition="vertical_node"
																					id="open_url"
																					label=_"Open demo"
																				[/button]
																			[/column]
																		[/row]
																	[/grid]
																[/column]
															[/row]
															[row]
																[column]
																	border="top, bottom"
																	border_size=4
																	horizontal_alignment="edge"
																	[image]
																		definition="default"
																		label="misc/split_line.png"
																	[/image]
																[/column]
															[/row]
														[/grid]
													[/toggle_panel]
												[/column]
											[/row]
										[/list_definition]
									[/listbox]
								[/column]
							[/row]
						[/layer]
						[layer]
							id="workout_layer"
							[row]
								[column]
									border="top"
									border_size=8
									horizontal_alignment="edge"
									vertical_alignment="edge"
									[listbox]
										definition="default"
										height="(0)"
										horizontal_scrollbar_mode="never"
										id="wkofile_list"
										width="(0)"
										[list_definition]
											[row]
												[column]
													[toggle_panel]
														definition="default"
														[grid]
															[row]
																[column]
																	horizontal_alignment="edge"
																	[grid]
																		[row]
																			[column]
																				grow_factor=1
																				horizontal_alignment="edge"
																				[grid]
																					[row]
																						[column]
																							horizontal_alignment="left"
																							[label]
																								definition="default"
																								id="name"
																								mtwusc=true
																							[/label]
																						[/column]
																					[/row]
																					[row]
																						[column]
																							horizontal_alignment="left"
																							[label]
																								definition="default"
																								id="file"
																								mtwusc=true
																								state=1
																								text_font_size=999
																							[/label]
																						[/column]
																					[/row]
																				[/grid]
																			[/column]
																			[column]
																				[button]
																					definition="vertical_node"
																					id="open_url"
																					label=_"Open demo"
																				[/button]
																			[/column]
																		[/row]
																	[/grid]
																[/column]
															[/row]
															[row]
																[column]
																	border="top, bottom"
																	border_size=4
																	horizontal_alignment="edge"
																	[image]
																		definition="default"
																		label="misc/split_line.png"
																	[/image]
																[/column]
															[/row]
														[/grid]
													[/toggle_panel]
												[/column]
											[/row]
										[/list_definition]
									[/listbox]
								[/column]
							[/row]
						[/layer]
						[layer]
							id="me_layer"
							[row]
								[column]
									horizontal_alignment="left"
									vertical_alignment="bottom"
									[label]
										definition="default"
										id="version"
										mtwusc=true
										state=1
										text_font_size=999
									[/label]
								[/column]
							[/row]
						[/layer]
					[/stack]
				[/column]
			[/row]
			[row]
				[column]
					horizontal_alignment="edge"
					[image]
						definition="default"
						label="misc/split_line.png"
					[/image]
				[/column]
			[/row]
			[row]
				[column]
					border="left, right"
					border_size=8
					horizontal_alignment="edge"
					[report]
						definition="default"
						fixed_cols=3
						horizontal_scrollbar_mode="never"
						id="navigation"
						multi_line=true
						toggle=true
						unit_definition="vertical_node"
						unit_height="(0)"
						unit_width="(0)"
					[/report]
				[/column]
			[/row]
			[row]
				[column]
					[spacer]
						definition="default"
						height="(corner_height)"
					[/spacer]
				[/column]
			[/row]
		[/grid]
	[/resolution]
[/window]
