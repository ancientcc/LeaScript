[workout]
	author="阿见见Zz"
	id="lea_bellyfatburner"
	reference="https://www.bilibili.com/video/BV1Xdg564Ehf"
	title="瘦腰瘦肚子(10次)"
	version="1.0.1-20260926"
	[state2]
		state="播报开场"
		[task]
			msgstr="瘦腰瘦肚子训练，10次版本。手机摆在右侧，镜头跟身体平行，对准肚脐附近，放好后，原地躺下，左手向后伸直，等待定位完成"
			type="speak"
		[/task]
		[next]
			[branch]
				do_bool_set="set_none"
				do_str=""
				do_to_state=1
				[judge]
					op="bool_equal"
					r_exp=true
					var_exp="$(is_wko_task_finished,)"
				[/judge]
			[/branch]
		[/next]
	[/state2]
	[state2]
		action_tpl2_id="dead_bug_setup"
