[workout]
	author="阿见见Zz"
	id="lea_bellyfatburner2"
	title="瘦腰瘦肚子2(6次)"
	reference="https://www.bilibili.com/video/BV1Z4bH6NEyp"
	version="1.0.1-20260903"
	[state2]
		state="播报开场"
		[task]
			msgstr="瘦腰瘦肚子2训练，6次版本。手机摆在右侧，镜头跟身体平行，对准肚脐附近，放好后，原地躺下，等待定位完成"
			type="speak"
		[/task]
		[next]
			[branch]
				do_bool_set="set_none"
				do_str=""
				do_to_state=1
				[judge]
					op="bool_equal"
					r_exp=true
					var_exp="$(is_wko_task_finished,)"
				[/judge]
			[/branch]
		[/next]
	[/state2]
	[state2]
		is_setup=true
		state="定位"
		unsatisfied_2th_threshold_s=5
		unsatisfied_threshold_ms=800
		[track_pose]
			[pose]
				landmarks="11; 27"
				min=0.05
				name="画面方向确认"
				operand="x"
				type="diff"
				unsatisfied_msgstr="请掉转方向，让头在画面右侧"
			[/pose]
			[pose]
				landmarks="11; 23; 25"
				min=155
				name="身体平直度（肩→髋→膝）"
				operand="point"
				type="angle3p"
				unsatisfied_msgstr="身体未完全伸直，请将身体撑成一条直线"
			[/pose]
			[pose]
				abs=true
				landmarks="11; 27"
				max=0.52
				min=0.35
				name="全身画面占比"
				operand="x"
				type="diff"
				unsatisfied_msgstr="靠近或拉近镜头，别太小"
				unsatisfied_rmax_msgstr="后退或推远镜头，别太大"
			[/pose]
			[pose]
				landmarks="23; 1000"
				max=0.15
				min=-0.15
				name="左髋水平居中"
				operand="x"
				type="diff"
				unsatisfied_msgstr="往头侧移动，或反向移手机"
				unsatisfied_rmax_msgstr="往脚侧移动，或反向移手机"
			[/pose]
			[pose]
				landmarks="1002; 15"
				min=0.05
				name="(左)伸手空间留白"
				operand="x"
				type="diff"
				unsatisfied_msgstr="身体往脚侧移点，确保后伸手不超出画面"
			[/pose]
			[pose]
				landmarks="27,28; 1001"
				min=0.4
				name="(上)抬脚空间留白"
				operand="y"
				type="diff"
				unsatisfied_msgstr="太靠上了，会不够伸脚空间，请往后退，或抬高手机"
			[/pose]
		[/track_pose]
		[task]
			max_count=5
			rule="strict"
			satisfied_threshold_s=3
			tone="full"
			type="time_counter"
		[/task]
		[next]
			[branch]
				do_bool_set="set_none"
				do_str=""
				do_to_state=2
				[judge]
					op="bool_equal"
					r_exp=true
					var_exp="$(is_wko_task_finished,)"
				[/judge]
			[/branch]
		[/next]
	[/state2]
	[state2]
		state="第1个动场开场"
		[task]
			msgstr="第1个动作，仰卧触膝卷腹，屈膝踩地，双手伸向膝盖，用腹部卷起，控制核心不松。开始"
			type="speak"
		[/task]
		[next]
			[branch]
				do_bool_set="set_none"
				do_str=""
				do_to_state=3
				[judge]
					op="bool_equal"
					r_exp=true
					var_exp="$(is_wko_task_finished,)"
				[/judge]
			[/branch]
		[/next]
	[/state2]
	[state2]
		action_tpl2_id="touch_knee_crunch_rep"
		state="仰卧触膝卷腹"
		[next]
			[branch]
				do_bool_set="set_none"
				do_str=""
				do_to_state=4
				[judge]
					op="bool_equal"
					r_exp=true
					var_exp="$(is_wko_task_finished,)"
				[/judge]
			[/branch]
		[/next]
	[/state2]
	[state2]
		state="第2个动场开场"
		[task]
			msgstr="第2个动作，卷腹手臂拍击，屈膝抬腿，卷起上身，下背部贴住垫子，快速拍击。开始"
			type="speak"
		[/task]
		[next]
			[branch]
				do_bool_set="set_none"
				do_str=""
				do_to_state=5
				[judge]
					op="bool_equal"
					r_exp=true
					var_exp="$(is_wko_task_finished,)"
				[/judge]
			[/branch]
		[/next]
	[/state2]
	[state2]
		action_tpl2_id="crunch_arm_pulse_rep"
		state="卷腹手臂拍击"
		[next]
			[branch]
				do_bool_set="set_none"
				do_str=""
				do_to_state=6
				[judge]
					op="bool_equal"
					r_exp=true
					var_exp="$(is_wko_task_finished,)"
				[/judge]
			[/branch]
		[/next]
	[/state2]
	[state2]
		state="第3个动场开场"
		[task]
			msgstr="第3个动作，仰卧屈膝抬腿，屁股向脚尖方向微微滑动，把腰压平贴地，屈膝抬起，小腿放平。开始"
			type="speak"
		[/task]
		[next]
			[branch]
				do_bool_set="set_none"
				do_str=""
				do_to_state=7
				[judge]
					op="bool_equal"
					r_exp=true
					var_exp="$(is_wko_task_finished,)"
				[/judge]
			[/branch]
		[/next]
	[/state2]
	[state2]
		action_tpl2_id="supine_leg_lift_rep"
		state="仰卧屈膝抬腿"
		[next]
			[branch]
				do_bool_set="set_none"
				do_str=""
				do_to_state=8
				[judge]
					op="bool_equal"
					r_exp=true
					var_exp="$(is_wko_task_finished,)"
				[/judge]
			[/branch]
		[/next]
	[/state2]
	[state2]
		state="第4个动作开场"
		[task]
			msgstr="第4个动作，体前体侧交替侧卷腹，左手撑地，右脚伸到体前，右手向前去触碰右脚尖，呼气收腹。开始"
			type="speak"
		[/task]
		[next]
			[branch]
				do_bool_set="set_none"
				do_str=""
				do_to_state=9
				[judge]
					op="bool_equal"
					r_exp=true
					var_exp="$(is_wko_task_finished,)"
				[/judge]
			[/branch]
		[/next]
	[/state2]
	[state2]
		action_tpl2_id="side_plank_front_side_crunch_left_rep"
		state="体前体侧交替侧卷腹"
		[next]
			[branch]
				do_bool_set="set_none"
				do_str=""
				do_to_state=10
				[judge]
					op="bool_equal"
					r_exp=true
					var_exp="$(is_wko_task_finished,)"
				[/judge]
			[/branch]
		[/next]
	[/state2]
	[state2]
		state="第5个动场开场"
		[task]
			msgstr="第5个动作，眼镜蛇式拉伸，俯卧垫上，双腿贴地，双手撑起上身，腹部微离地，眼睛看天花板。开始"
			type="speak"
		[/task]
		[next]
			[branch]
				do_bool_set="set_none"
				do_str=""
				do_to_state=11
				[judge]
					op="bool_equal"
					r_exp=true
					var_exp="$(is_wko_task_finished,)"
				[/judge]
			[/branch]
		[/next]
	[/state2]
	[state2]
		action_tpl2_id="cobra_stretch_time"
		state="眼镜蛇式拉伸"
		[task]
			max_count=20
			tone="full"
		[/task]
		[next]
			[branch]
				do_bool_set="set_none"
				do_str=""
				do_to_state=12
				[judge]
					op="bool_equal"
					r_exp=true
					var_exp="$(is_wko_task_finished,)"
				[/judge]
			[/branch]
		[/next]
	[/state2]
	[state2]
		state="已结束"
		[task]
			msgstr="瘦腰瘦肚子2，已结束。"
			repeat_s=10
			type="speak"
		[/task]
		[next]
		[/next]
	[/state2]
[/workout]
