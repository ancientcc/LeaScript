[workout]
	author="小兔子乖乖smile"
	id="lea_lumbarspine2g"
	title="腰椎操(第二组)(10次)"
	reference="https://www.bilibili.com/video/BV1yP411z7iF"
	version="1.0.1-20260903"
	[state2]
		state="播放开场和定位"
		[task]
			msgstr="腰椎操训练。请将手机放正前方，摆好手机后，请站到画面中央，保持身体正对镜头，等待定位完成"
			type="speak"
		[/task]
		[next]
			[branch]
				do_bool_set="set_none"
				do_str=""
				do_to_state=1
				[judge]
					op="bool_equal"
					r_exp=true
					var_exp="$(is_wko_task_finished,)"
				[/judge]
			[/branch]
		[/next]
	[/state2]
	[state2]
		is_setup=true
		state="定位"
		unsatisfied_2th_threshold_s=5
		unsatisfied_threshold_ms=800
		[track_pose]
			[pose]
				landmarks="11,12; 23,24"
				max=275
				min=265
				name="身体歪斜角度"
				operand="point"
				type="angle2p"
				unsatisfied_msgstr="身体不要太歪"
			[/pose]
			[pose]
				landmarks="11,12; 1000"
				max=0.15
				min=-0.15
				name="水平居中"
				operand="x"
				type="diff"
				unsatisfied_msgstr="请往左边平移，靠近摄像头中心"
				unsatisfied_rmax_msgstr="请往右边平移，靠近摄像头中心"
			[/pose]
			[pose]
				landmarks="11,12; 1001"
				min=0.1
				name="肩以上高度"
				operand="y"
				type="diff"
				unsatisfied_msgstr="请后退或抬高手机"
			[/pose]
			[pose]
				abs=true
				landmarks="11,12; 27,28"
				min=0.4
				name="人物不能太小"
				operand="y"
				type="diff"
				unsatisfied_msgstr="请往前走一点，让身体在画面中更大一些"
			[/pose]
		[/track_pose]
		[task]
			max_count=5
			rule="strict"
			satisfied_threshold_s=3
			tone="full"
			type="time_counter"
		[/task]
		[next]
			[branch]
				do_bool_set="set_none"
				do_str=""
				do_to_state=2
				[judge]
					op="bool_equal"
					r_exp=true
					var_exp="$(is_wko_task_finished,)"
				[/judge]
			[/branch]
		[/next]
	[/state2]
	[state2]
		state="播放第一个动作要领"
		[task]
			msgstr="定位完成。第一个动作：环臂摆腰。朝向右，身体微转向镜头，不要完全侧对，左脚向后退"
			type="speak"
		[/task]
		[next]
			[branch]
				do_bool_set="set_none"
				do_str=""
				do_to_state=3
				[judge]
					op="bool_equal"
					r_exp=true
					var_exp="$(is_wko_task_finished,)"
				[/judge]
			[/branch]
		[/next]
	[/state2]
	[state2]
		action_tpl2_id="waist_swing_arm_circle_right_rep"
		state="环臂摆腰(向右)"
		[next]
			[branch]
				do_bool_set="set_none"
				do_str=""
				do_to_state=4
				[judge]
					op="bool_equal"
					r_exp=true
					var_exp="$(is_wko_task_finished,)"
				[/judge]
			[/branch]
		[/next]
	[/state2]
	[state2]
		state="第1个动作(向左)开场"
		[task]
			msgstr="换边，朝向左，身体微转向镜头，不要完全侧对，右脚向后退"
			type="speak"
		[/task]
		[next]
			[branch]
				do_bool_set="set_none"
				do_str=""
				do_to_state=5
				[judge]
					op="bool_equal"
					r_exp=true
					var_exp="$(is_wko_task_finished,)"
				[/judge]
			[/branch]
		[/next]
	[/state2]
	[state2]
		action_tpl2_id="waist_swing_arm_circle_left_rep"
		state="环臂摆腰(向左)"
		[next]
			[branch]
				do_bool_set="set_none"
				do_str=""
				do_to_state=6
				[judge]
					op="bool_equal"
					r_exp=true
					var_exp="$(is_wko_task_finished,)"
				[/judge]
			[/branch]
		[/next]
	[/state2]
	[state2]
		state="第2个动场开场"
		[task]
			msgstr="第二个动作、侧踢迎掌"
			type="speak"
		[/task]
		[next]
			[branch]
				do_bool_set="set_none"
				do_str=""
				do_to_state=7
				[judge]
					op="bool_equal"
					r_exp=true
					var_exp="$(is_wko_task_finished,)"
				[/judge]
			[/branch]
		[/next]
	[/state2]
	[state2]
		action_tpl2_id="side_kick_palm_touch_alternating_rep"
		state="侧踢迎掌"
		[next]
			[branch]
				do_bool_set="set_none"
				do_str=""
				do_to_state=8
				[judge]
					op="bool_equal"
					r_exp=true
					var_exp="$(is_wko_task_finished,)"
				[/judge]
			[/branch]
		[/next]
	[/state2]
	[state2]
		state="第3个动作(向右)开场"
		[task]
			msgstr="第三个动作，挤腰空踏，朝向右，身体微转向镜头，不要完全侧对，抬右脚"
			type="speak"
		[/task]
		[next]
			[branch]
				do_bool_set="set_none"
				do_str=""
				do_to_state=9
				[judge]
					op="bool_equal"
					r_exp=true
					var_exp="$(is_wko_task_finished,)"
				[/judge]
			[/branch]
		[/next]
	[/state2]
	[state2]
		action_tpl2_id="waist_squeeze_air_step_right_rep"
		state="挤腰空踏(向右)"
		[next]
			[branch]
				do_bool_set="set_none"
				do_str=""
				do_to_state=10
				[judge]
					op="bool_equal"
					r_exp=true
					var_exp="$(is_wko_task_finished,)"
				[/judge]
			[/branch]
		[/next]
	[/state2]
	[state2]
		state="第3个动作(向左)开场"
		[task]
			msgstr="换边，朝向左，身体微转向镜头，不要完全侧对，抬左脚"
			type="speak"
		[/task]
		[next]
			[branch]
				do_bool_set="set_none"
				do_str=""
				do_to_state=11
				[judge]
					op="bool_equal"
					r_exp=true
					var_exp="$(is_wko_task_finished,)"
				[/judge]
			[/branch]
		[/next]
	[/state2]
	[state2]
		action_tpl2_id="waist_squeeze_air_step_left_rep"
		state="挤腰空踏(向左)"
		[next]
			[branch]
				do_bool_set="set_none"
				do_str=""
				do_to_state=12
				[judge]
					op="bool_equal"
					r_exp=true
					var_exp="$(is_wko_task_finished,)"
				[/judge]
			[/branch]
		[/next]
	[/state2]
	[state2]
		state="已结束"
		[task]
			msgstr="腰椎操，已结束。"
			repeat_s=10
			type="speak"
		[/task]
		[next]
		[/next]
	[/state2]
[/workout]
