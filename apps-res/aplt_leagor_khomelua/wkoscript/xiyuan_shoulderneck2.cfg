[workout]
	author="西苑医院"
	id="xiyuan_shoulderneck2"
	reference="https://www.bilibili.com/video/BV188gr6FEeV"
	title="肩颈操2(西苑.侧腰)"
	version="1.0.1-20260926"
	[state2]
		state="播报开场和定位"
		[task]
			msgstr="西苑版肩颈操、侧腰版训练。请将手机放正前方。摆好手机后，请站到画面中央，靠墙，保持身体正对镜头，等待定位完成。"
			type="speak"
		[/task]
		[next]
			[branch]
				do_bool_set="set_none"
				do_str=""
				do_to_state=1
				[judge]
					op="bool_equal"
					r_exp=true
					var_exp="$(is_wko_task_finished,)"
				[/judge]
			[/branch]
		[/next]
	[/state2]
	[state2]
		action_tpl2_id="standing_hips_raised_arms_setup"
		state="定位"
		[next]
			[branch]
				do_bool_set="set_none"
				do_str=""
				do_to_state=2
				[judge]
					op="bool_equal"
					r_exp=true
					var_exp="$(is_wko_task_finished,)"
				[/judge]
			[/branch]
		[/next]
	[/state2]
	[state2]
		state="(播报第1个动作"
		[task]
			msgstr="定位完成。站姿向左侧弯。左手虎口卡在胯骨上方，右手扶左耳，手肘朝天。靠侧腰发力向左侧弯，拉伸右侧腰。开始"
			type="speak"
		[/task]
		[next]
			[branch]
				do_bool_set="set_none"
				do_str=""
				do_to_state=3
				[judge]
					op="bool_equal"
					r_exp=true
					var_exp="$(is_wko_task_finished,)"
				[/judge]
			[/branch]
		[/next]
	[/state2]
	[state2]
		action_tpl2_id="standing_side_bend_left_time"
		state="站姿向左侧弯"
		[next]
			[branch]
				do_bool_set="set_none"
				do_str=""
				do_to_state=4
				[judge]
					op="bool_equal"
					r_exp=true
					var_exp="$(is_wko_task_finished,)"
				[/judge]
			[/branch]
		[/next]
	[/state2]
	[state2]
		state="播报第2个动作"
		[task]
			msgstr="结束动作，慢慢还原。站姿向右侧弯。右手虎口卡在胯骨上方，左手扶右耳，手肘朝天。靠侧腰发力向右侧弯，拉伸左侧腰。开始"
			type="speak"
		[/task]
		[next]
			[branch]
				do_bool_set="set_none"
				do_str=""
				do_to_state=5
				[judge]
					op="bool_equal"
					r_exp=true
					var_exp="$(is_wko_task_finished,)"
				[/judge]
			[/branch]
		[/next]
	[/state2]
	[state2]
		action_tpl2_id="standing_side_bend_right_time"
		state="站姿向右侧弯"
		[next]
			[branch]
				do_bool_set="set_none"
				do_str=""
				do_to_state=6
				[judge]
					op="bool_equal"
					r_exp=true
					var_exp="$(is_wko_task_finished,)"
				[/judge]
			[/branch]
		[/next]
	[/state2]
	[state2]
		state="播报第3个动作"
		[task]
			msgstr="结束动作，慢慢还原。站姿小燕飞。双脚站稳，双臂向后伸直，肩膀向后展开，骨盆微微前送，头可轻微后仰，感受腰背舒展。开始！"
			type="speak"
		[/task]
		[next]
			[branch]
				do_bool_set="set_none"
				do_str=""
				do_to_state=7
				[judge]
					op="bool_equal"
					r_exp=true
					var_exp="$(is_wko_task_finished,)"
				[/judge]
			[/branch]
		[/next]
	[/state2]
	[state2]
		action_tpl2_id="standing_swallow_rep"
		state="站姿小燕飞"
		[next]
			[branch]
				do_bool_set="set_none"
				do_str=""
				do_to_state=8
				[judge]
					op="bool_equal"
					r_exp=true
					var_exp="$(is_wko_task_finished,)"
				[/judge]
			[/branch]
		[/next]
