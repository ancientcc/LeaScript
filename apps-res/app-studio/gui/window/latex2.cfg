#textdomain studio-lib

[window]
	app="studio"
	id="latex2"
	[resolution]
		{GUI__COMMON_FLOAT_WIDGETS}
		automatic_placement=false
		definition="scale_screen"
		height="(screen_height)"
		width="(screen_width)"
		x="(0)"
		y="(0)"
		[grid]
			[row]
				[column]
					horizontal_alignment="edge"
					[panel]
						definition="default"
						[grid]
							[row]
								[column]
									[spacer]
										definition="default"
										height="(statusbar_height)"
									[/spacer]
								[/column]
							[/row]
							[row]
								[column]
									horizontal_alignment="edge"
									[grid]
										[row]
											[column]
												[button]
													definition="icon36"
													id="ok"
													label="misc/back.png"
												[/button]
											[/column]
											[column]
												grow_factor=1
												[label]
													definition="default"
													id="title"
												[/label]
											[/column]
											[column]
												[spacer]
													definition="default"
													width="(36)"
												[/spacer]
											[/column]
										[/row]
									[/grid]
								[/column]
							[/row]
						[/grid]
					[/panel]
				[/column]
			[/row]
			[row]
				[column]
					border="left, right"
					border_size=8
					horizontal_alignment="left"
					[label]
						definition="default"
						id="remark"
						mtwusc=true
						state=1
						text_font_size=998
					[/label]
				[/column]
			[/row]
			[row]
				grow_factor=1
				[column]
					[button]
						definition="default"
						id="generate_rsp"
						label=_"Generate latex-202xxxxx.rsp"
					[/button]
				[/column]
			[/row]
		[/grid]
	[/resolution]
[/window]
