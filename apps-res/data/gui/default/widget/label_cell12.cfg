#define _GUI_RESOLUTION RESOLUTION MIN_WIDTH MIN_HEIGHT EXTRA_WIDTH EXTRA_HEIGHT FONT_SIZE FONT_COLOR_ENABLED FONT_COLOR_DISABLED
	[resolution]

		{RESOLUTION}

		min_width = {MIN_WIDTH}
		min_height = {MIN_HEIGHT}		
		
		extra_width = {EXTRA_WIDTH}
		extra_height = {EXTRA_HEIGHT}

		[state_enabled]

			[draw]

				{GUI__CELL7_OFF_V 12 12 24 0 0 ".png"}
				# {GUI__CELL7_OFF 4 4 8 0 0 "border3" ".png"}
				{GUI__LEFT_CENTERED_TEXT ({EXTRA_WIDTH} / 2) () ({FONT_COLOR_ENABLED})}
				
			[/draw]

		[/state_enabled]

		[state_disabled]

			[draw]
			
				{GUI__CELL7_OFF_V 12 12 24 0 0 ".png"}
				# {GUI__CELL7_OFF 4 4 8 0 0 "border3" ".png"}
				{GUI__LEFT_CENTERED_TEXT ({EXTRA_WIDTH} / 2) () ({FONT_COLOR_DISABLED})}

			[/draw]

		[/state_disabled]

	[/resolution]
#enddef

#define _GUI_DEFINITION ID DESCRIPTION MIN_WIDTH MIN_HEIGHT FONT_SIZE FONT_COLOR
[label_definition]
	id = {ID}
	description = {DESCRIPTION}

	{_GUI_RESOLUTION
		({GUI_NORMAL__RESOLUTION})
		({MIN_WIDTH})
		({MIN_HEIGHT})
		8
		8
		({GUI_FONT_SIZE__{FONT_SIZE}})
		({GUI__FONT_COLOR_ENABLED__{FONT_COLOR}})
		({GUI__FONT_COLOR_DISABLED__{FONT_COLOR}})
	}

[/label_definition]
#enddef

{_GUI_DEFINITION "cell12" "board is 9.1 images, SIZE_1 = SIZE_2 = 12" 32 24 DEFAULT DEFAULT}

#undef _GUI_DEFINITION
#undef _GUI_RESOLUTION
