#textdomain rose-lib

[window]
	app="rose"
	id="action_lib2"
	[resolution]
		{GUI__COMMON_FLOAT_WIDGETS}
		automatic_placement=false
		definition="scale_screen"
		height="(screen_height)"
		width="(screen_width)"
		x="(0)"
		y="(0)"
		[grid]
			[row]
				[column]
					horizontal_alignment="edge"
					[panel]
						definition="default"
						[grid]
							[row]
								[column]
									[spacer]
										definition="default"
										height="(statusbar_height)"
									[/spacer]
								[/column]
							[/row]
						[/grid]
					[/panel]
				[/column]
			[/row]
			[row]
				[column]
					horizontal_alignment="edge"
					[grid]
						id="title_grid"
						[row]
							[column]
								[spacer]
									definition="default"
									width="(36)"
								[/spacer]
							[/column]
							[column]
								grow_factor=1
								[label]
									definition="default"
									id="title"
								[/label]
							[/column]
							[column]
								[button]
									definition="icon36"
									id="share"
									label="misc/share.png"
								[/button]
							[/column]
						[/row]
					[/grid]
				[/column]
			[/row]
			[row]
				grow_factor=1
				[column]
					horizontal_alignment="edge"
					vertical_alignment="edge"
					[panel]
						definition="default"
						[grid]
							[row]
								[column]
									horizontal_alignment="edge"
									vertical_alignment="edge"
									[listbox]
										definition="default"
										height="(0)"
										horizontal_scrollbar_mode="never"
										id="action_list"
										width="(0)"
										[linked_group]
											fixed_width=true
											id="index"
										[/linked_group]
										[linked_group]
											fixed_width=true
											id="name"
										[/linked_group]
										[linked_group]
											fixed_width=true
											id="task"
										[/linked_group]
										[list_definition]
											[row]
												[column]
													[toggle_panel]
														definition="default"
														[grid]
															[row]
																[column]
																	horizontal_alignment="edge"
																	[grid]
																		[row]
																			[column]
																				border="right"
																				border_size=8
																				[label]
																					definition="default"
																					id="index"
																					linked_group="index"
																					state=1
																				[/label]
																			[/column]
																			[column]
																				border="right"
																				border_size=8
																				[label]
																					definition="default"
																					id="name"
																					linked_group="name"
																				[/label]
																			[/column]
																			[column]
																				[label]
																					definition="default"
																					id="task"
																					linked_group="task"
																					state=1
																				[/label]
																			[/column]
																			[column]
																				border="right"
																				border_size=8
																				grow_factor=1
																				horizontal_alignment="left"
																				[label]
																					definition="default"
																					id="msg"
																					mtwusc=true
																					state=1
																					text_font_size=999
																				[/label]
																			[/column]
																		[/row]
																	[/grid]
																[/column]
															[/row]
															[row]
																[column]
																	border="top, bottom"
																	border_size=4
																	horizontal_alignment="edge"
																	[image]
																		definition="default"
																		label="misc/split_line.png"
																	[/image]
																[/column]
															[/row]
														[/grid]
													[/toggle_panel]
												[/column]
											[/row]
										[/list_definition]
									[/listbox]
								[/column]
							[/row]
						[/grid]
					[/panel]
				[/column]
			[/row]
			[row]
				[column]
					border="all"
					border_size=8
					horizontal_alignment="right"
					[grid]
						[row]
							[column]
								[button]
									definition="default"
									id="ok2"
									label=_"OK"
								[/button]
							[/column]
							[column]
								[spacer]
									definition="default"
									width="(24)"
								[/spacer]
							[/column]
							[column]
								[button]
									definition="default"
									id="cancel"
									label=_"Cancel"
								[/button]
							[/column]
						[/row]
					[/grid]
				[/column]
			[/row]
		[/grid]
	[/resolution]
[/window]
