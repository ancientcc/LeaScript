#textdomain rose-lib

[window]
	app="rose"
	id="insert_scene"
	[resolution]
		{GUI__COMMON_FLOAT_WIDGETS}
		definition="default"
		[grid]
			[row]
				[column]
					border="top, bottom"
					border_size=8
					[label]
						definition="default"
						id="title"
					[/label]
				[/column]
			[/row]
			[row]
				[column]
					[spacer]
						definition="default"
						width="((if(screen_width < 640, screen_width * 90 / 100, 576)))"
					[/spacer]
				[/column]
			[/row]
			[row]
				grow_factor=8
				[column]
					border="bottom"
					border_size=8
					horizontal_alignment="edge"
					[grid]
						id="task_grid"
						[row]
							[column]
								[label]
									definition="default"
								[/label]
							[/column]
							[column]
								grow_factor=1
								horizontal_alignment="edge"
								[button]
									definition="dropdown"
									id="task"
								[/button]
							[/column]
						[/row]
					[/grid]
				[/column]
			[/row]
			[row]
				[column]
					border="bottom"
					border_size=8
					horizontal_alignment="edge"
					[grid]
						id="input_vars_grid"
						[row]
							[column]
								border="right"
								border_size=4
								[button]
									definition="default"
									id="edit_input_vars"
									label=_"Edit input vars"
								[/button]
							[/column]
							[column]
								grow_factor=1
								horizontal_alignment="left"
								[label]
									definition="cell12"
									id="input_vars"
									mtwusc=true
									state=1
									text_font_size=999
								[/label]
							[/column]
						[/row]
					[/grid]
				[/column]
			[/row]
			[row]
				[column]
					border="bottom"
					border_size=12
					horizontal_alignment="edge"
					[grid]
						id="name_id_grid"
						[row]
							[column]
								[label]
									definition="default"
									label=_"object^Name"
								[/label]
							[/column]
							[column]
								grow_factor=1
								horizontal_alignment="left"
								[label]
									definition="cell12"
									id="name"
									mtwusc=true
									state=1
									text_font_size=999
								[/label]
							[/column]
						[/row]
					[/grid]
				[/column]
			[/row]
			[row]
				[column]
					horizontal_alignment="right"
					[grid]
						[row]
							[column]
								[button]
									definition="default"
									id="ok"
									label=_"OK"
								[/button]
							[/column]
							[column]
								[spacer]
									definition="default"
									width="(20)"
								[/spacer]
							[/column]
							[column]
								[button]
									definition="default"
									id="cancel"
									label=_"Cancel"
								[/button]
							[/column]
						[/row]
					[/grid]
				[/column]
			[/row]
		[/grid]
	[/resolution]
[/window]
