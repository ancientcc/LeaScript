#textdomain rose-lib

[window]
	app="rose"
	id="rqrcode"
	[resolution]
		{GUI__COMMON_FLOAT_WIDGETS}
		definition="default"
		[grid]
			[row]
				[column]
					border="top, bottom"
					border_size=8
					[label]
						definition="default"
						id="title"
						text_font_size=1001
					[/label]
				[/column]
			[/row]
			[row]
				grow_factor=1
				[column]
					horizontal_alignment="edge"
					vertical_alignment="edge"
					[track]
						definition="default"
						id="track"
					[/track]
				[/column]
			[/row]
			[row]
				[column]
					border="top, bottom"
					border_size=8
					[label]
						definition="default"
						id="remark"
						state=1
						text_font_size=998
					[/label]
				[/column]
			[/row]
		[/grid]
	[/resolution]
[/window]
