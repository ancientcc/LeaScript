																													[/column]
																												[/row]
																												[row]
																													[column]
																														horizontal_alignment="left"
																														[label]
																															definition="default"
																															id="subtitle"
																															mtwusc=true
																															state=1
																															text_font_size=998
																														[/label]
																													[/column]
																												[/row]
																											[/grid]
																										[/column]
																										[column]
																											border="bottom"
