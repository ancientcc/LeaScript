#textdomain rose-lib

[window]
	app="rose"
	id="rstore"
	[resolution]
		{GUI__COMMON_FLOAT_WIDGETS}
		automatic_placement=false
		definition="scale_screen"
		height="(screen_height)"
		width="(screen_width)"
		x="(0)"
		y="(0)"
		[grid]
			[row]
				[column]
					[spacer]
						definition="default"
						height="(statusbar_height)"
					[/spacer]
				[/column]
			[/row]
			[row]
				[column]
					horizontal_alignment="edge"
					[rose__statusbar]
						id="statusbar"
					[/rose__statusbar]
				[/column]
			[/row]
			[row]
				[column]
					horizontal_alignment="edge"
					[panel]
						bottom_margin=0
						definition="default"
						top_margin=0
						[grid]
							[row]
								[column]
									[button]
										definition="icon36"
										id="cancel"
										label="misc/back.png"
									[/button]
								[/column]
								[column]
									grow_factor=1
									[label]
										definition="default"
										id="title"
									[/label]
								[/column]
								[column]
									[button]
										definition="icon36"
										id="qr_scan"
										label="misc/qr_scan.png"
									[/button]
								[/column]
							[/row]
						[/grid]
					[/panel]
				[/column]
			[/row]
			[row]
				[column]
					horizontal_alignment="edge"
					[report]
						definition="default"
						horizontal_scrollbar_mode="never"
						id="bar"
						toggle=true
						unit_definition="text"
						unit_height="(0)"
						unit_width="(0)"
					[/report]
				[/column]
			[/row]
			[row]
				grow_factor=1
				[column]
					horizontal_alignment="edge"
					vertical_alignment="edge"
					[panel]
						definition="default"
						id="bar_panel"
						[grid]
							[row]
								[column]
									horizontal_alignment="edge"
									vertical_alignment="edge"
									[stack]
										definition="default"
										id="body"
										mode="radio"
										[layer]
											id="recommend_grid"
											[row]
												[column]
													horizontal_alignment="edge"
													vertical_alignment="edge"
													[listbox]
														definition="default"
														height="(0)"
														horizontal_scrollbar_mode="never"
														id="applets"
														width="(0)"
														[list_definition]
															[row]
																[column]
																	[toggle_panel]
																		definition="default"
																		[grid]
																			[row]
																				[column]
																					border="bottom"
																					border_size=8
																					[image]
																						definition="default"
																						height="(48)"
																						id="icon"
																						width="(48)"
																					[/image]
																				[/column]
																				[column]
																					grow_factor=1
																					horizontal_alignment="edge"
																					vertical_alignment="edge"
																					[grid]
																						[row]
																							grow_factor=1
																							[column]
																								grow_factor=1
																								horizontal_alignment="edge"
																								vertical_alignment="edge"
																								[grid]
																									[row]
																										[column]
																											grow_factor=1
																											horizontal_alignment="edge"
																											[grid]
																												[row]
																													[column]
																														horizontal_alignment="left"
																														[label]
																															definition="default"
																															id="title"
																															mtwusc=true
																														[/label]
																													[/column]
																												[/row]
																												[row]
																													[column]
																														horizontal_alignment="left"
																														[label]
																															definition="default"
																															id="subtitle"
																															mtwusc=true
																															state=1
																															text_font_size=998
																														[/label]
																													[/column]
																												[/row]
																											[/grid]
																										[/column]
																										[column]
																											border="left"
																											border_size=12
																											[button]
																												definition="icon36"
																												height="(40)"
																												id="install"
																												width="(40)"
																											[/button]
																										[/column]
																									[/row]
																								[/grid]
																							[/column]
																						[/row]
																						[row]
																							[column]
																								horizontal_alignment="edge"
																								[image]
																									definition="default"
																									label="misc/split_line.png"
																								[/image]
																							[/column]
																						[/row]
																					[/grid]
																				[/column]
																			[/row]
																		[/grid]
																	[/toggle_panel]
																[/column]
															[/row]
														[/list_definition]
													[/listbox]
												[/column]
											[/row]
										[/layer]
										[layer]
											id="find_grid"
											[row]
												[column]
													grow_factor=1
													horizontal_alignment="edge"
													vertical_alignment="edge"
													[grid]
														[row]
															[column]
																border="right"
																border_size=8
																grow_factor=1
																horizontal_alignment="edge"
																[text_box]
																	definition="default"
																	height="(40)"
																	id="title"
																[/text_box]
															[/column]
															[column]
																[button]
																	definition="icon36"
																	id="find"
																	label="misc/find.png"
																[/button]
															[/column]
														[/row]
													[/grid]
												[/column]
											[/row]
											[row]
												grow_factor=1
												[column]
													horizontal_alignment="edge"
													vertical_alignment="edge"
													[listbox]
														definition="default"
														height="(0)"
														horizontal_scrollbar_mode="never"
														id="applets"
														width="(0)"
														[list_definition]
															[row]
																[column]
																	[toggle_panel]
																		definition="default"
																		[grid]
																			[row]
																				[column]
																					border="bottom"
																					border_size=8
																					[image]
																						definition="default"
																						height="(48)"
																						id="icon"
																						width="(48)"
																					[/image]
																				[/column]
																				[column]
																					grow_factor=1
																					horizontal_alignment="edge"
																					vertical_alignment="edge"
																					[grid]
																						[row]
																							grow_factor=1
																							[column]
																								grow_factor=1
																								horizontal_alignment="edge"
																								vertical_alignment="edge"
																								[grid]
																									[row]
																										[column]
																											grow_factor=1
																											horizontal_alignment="edge"
																											[grid]
																												[row]
																													[column]
																														horizontal_alignment="left"
																														[label]
																															definition="default"
																															id="title"
																															mtwusc=true
																														[/label]
																													[/column]
																												[/row]
																												[row]
																													[column]
																														horizontal_alignment="left"
																														[label]
																															definition="default"
																															id="subtitle"
																															mtwusc=true
																															state=1
																															text_font_size=998
																														[/label]
																													[/column]
																												[/row]
																											[/grid]
																										[/column]
																										[column]
																											border="left"
																											border_size=12
																											[button]
																												definition="icon36"
																												height="(40)"
																												id="install"
																												width="(40)"
																											[/button]
																										[/column]
																									[/row]
																								[/grid]
																							[/column]
																						[/row]
																						[row]
																							[column]
																								horizontal_alignment="edge"
																								[image]
																									definition="default"
																									label="misc/split_line.png"
																								[/image]
																							[/column]
																						[/row]
																					[/grid]
																				[/column]
																			[/row]
																		[/grid]
																	[/toggle_panel]
																[/column]
															[/row]
														[/list_definition]
													[/listbox]
												[/column]
											[/row]
										[/layer]
										[layer]
											id="me_grid"
											[row]
												grow_factor=1
												[column]
													horizontal_alignment="edge"
													vertical_alignment="edge"
													[listbox]
														definition="default"
														height="(0)"
														horizontal_scrollbar_mode="never"
														id="applets"
														width="(0)"
														[list_definition]
															[row]
																[column]
																	[toggle_panel]
