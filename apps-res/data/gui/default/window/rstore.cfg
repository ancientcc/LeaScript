												[/column]
											[/row]
											[row]
												[column]
													border="top"
													border_size=8
													horizontal_alignment="edge"
													vertical_alignment="edge"
													[grid]
														[row]
															[column]
																horizontal_alignment="left"
																[button]
																	definition="text"
																	id="devel_install"
																	label=_"Install development"
																[/button]
															[/column]
														[/row]
													[/grid]
												[/column]
											[/row]
										[/layer]
									[/stack]
								[/column]
							[/row]
						[/grid]
					[/panel]
				[/column]
			[/row]
		[/grid]
	[/resolution]
[/window]
