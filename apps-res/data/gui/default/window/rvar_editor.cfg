#textdomain rose-lib

[window]
	app="rose"
	id="rvar_editor"
	[resolution]
		{GUI__COMMON_FLOAT_WIDGETS}
		automatic_placement=false
		definition="scale_screen"
		height="(screen_height)"
		width="(screen_width)"
		x="(0)"
		y="(0)"
		[grid]
			[row]
				[column]
					grow_factor=1
					[spacer]
						definition="default"
						height="(statusbar_height)"
					[/spacer]
				[/column]
			[/row]
			[row]
				[column]
					horizontal_alignment="edge"
					[rose__statusbar]
						id="statusbar"
					[/rose__statusbar]
				[/column]
			[/row]
			[row]
				[column]
					horizontal_alignment="edge"
					[grid]
						id="title_grid"
						[row]
							[column]
								[button]
									definition="icon36"
									id="back"
									label="misc/back.png"
								[/button]
							[/column]
							[column]
								grow_factor=1
								[label]
									definition="default"
									id="title"
								[/label]
							[/column]
							[column]
								[button]
									definition="icon36"
									id="insert_var"
									label="misc/insert_var.png"
								[/button]
							[/column]
						[/row]
					[/grid]
				[/column]
			[/row]
			[row]
				[column]
					border="left, right"
					border_size=8
					horizontal_alignment="left"
					[label]
						definition="default"
						id="remark"
						mtwusc=true
						state=1
						text_font_size=998
					[/label]
				[/column]
			[/row]
			[row]
				grow_factor=1
				[column]
					border="all"
					border_size=8
					horizontal_alignment="edge"
					vertical_alignment="edge"
					[listbox]
						definition="default"
						height="(0)"
						horizontal_scrollbar_mode="never"
						id="var_list"
						width="(0)"
						width_is_max=true
						[linked_group]
							fixed_width=true
							id="index"
						[/linked_group]
						[linked_group]
							fixed_width=true
							id="name"
						[/linked_group]
						[list_definition]
							[row]
								[column]
									[toggle_panel]
										definition="default"
										[grid]
											[row]
												[column]
													border="top"
													border_size=4
													horizontal_alignment="edge"
													[grid]
														[row]
															[column]
																[label]
																	definition="default"
																	id="index"
																	linked_group="index"
																[/label]
															[/column]
															[column]
																horizontal_alignment="left"
																[label]
																	definition="default"
																	id="name"
																	linked_group="name"
																	state=1
																	text_font_size=999
																[/label]
															[/column]
															[column]
																border="left, right"
																border_size=4
																grow_factor=1
																horizontal_alignment="edge"
																vertical_alignment="edge"
																[text_box]
																	definition="default"
																	id="val"
																[/text_box]
															[/column]
															[column]
																border="right"
																border_size=4
																[button]
																	definition="dropdown"
																	id="freq_val"
																	width="(128)"
																[/button]
															[/column]
															[column]
																border="right"
																border_size=4
																[button]
																	definition="icon36"
																	id="edit"
																	label="misc/edit.png"
																[/button]
															[/column]
															[column]
																[button]
																	definition="icon36"
																	id="erase"
																	label="misc/erase.png"
																[/button]
															[/column]
														[/row]
													[/grid]
												[/column]
											[/row]
										[/grid]
									[/toggle_panel]
								[/column]
							[/row]
						[/list_definition]
					[/listbox]
				[/column]
			[/row]
		[/grid]
	[/resolution]
[/window]
