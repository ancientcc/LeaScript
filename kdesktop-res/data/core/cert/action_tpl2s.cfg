[action_tpl2]
	id = "plank_setup"
	name = "定位(平板撑)"
	msg = "平板撑训练。手机摆在右侧，镜头跟身体平行，对准肚脐附近，放好手机后，原地趴下，保持不动，等待定位完成。"
	
		is_setup=true
		unsatisfied_2th_threshold_s=5
		unsatisfied_threshold_ms=800
		[track_pose]
			[pose]
				landmarks="12; 28"
				min=0.05
				name="画面方向确认"
				operand="x"
				type="diff"
				unsatisfied_msgstr="请掉转方向，让头在画面右侧"
			[/pose]
			[pose]
				landmarks="24; 1000"
				max=0.15
				min=-0.15
				name="右髋水平居中"
				operand="x"
				type="diff"
				unsatisfied_msgstr="往头侧移动，或反向移手机"
				unsatisfied_rmax_msgstr="往脚侧移动，或反向移手机"
			[/pose]
			[pose]
				abs=true
				landmarks="12; 28"
				max=0.65
				min=0.25
				name="全身画面占比"
				operand="x"
				type="diff"
				unsatisfied_msgstr="靠近或拉近镜头，别太小"
				unsatisfied_rmax_msgstr="后退或推远镜头，别太大"
			[/pose]
		[/track_pose]
		[task]
			max_count=5
			rule="strict"
			satisfied_threshold_s=3
			tone="full"
			type="time_counter"
		[/task]
[/action_tpl2]

