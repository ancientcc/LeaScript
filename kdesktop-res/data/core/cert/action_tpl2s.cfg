[body_part]
	[part]
		id = "core"
		name = "核心/腹部"
		note= "腹直肌、腹横肌、腹斜肌等"
	[/part]
	[part]
		id = "back"
		name = "背/腰"
		note= "竖脊肌、背阔肌、腰椎区域"
	[/part]
	[part]
		id = "shoulder"
		name = "肩"
		note= "三角肌、肩袖肌群"
	[/part]
	[part]
		id = "neck"
		name = "颈"
		note= "颈椎周围肌群"
	[/part]
	[part]
		id = "chest"
		name = "胸"
		note= "胸大肌、胸小肌"
	[/part]
	[part]
		id = "arm"
		name = "手臂"
		note= "肱二头肌、肱三头肌"
	[/part]
	[part]
		id = "upper"
		name = "上肢"
		note= "泛指肩+臂+胸（不可细分的统称）"
	[/part]
	[part]
		id = "hip"
		name = "髋/臀"
		note= "臀大肌、髂腰肌、髋关节"
	[/part]
	[part]
		id = "leg"
		name = "腿"
		note= "股四头肌、腘绳肌"
	[/part]
	[part]
		id = "knee"
		name = "膝"
		note= "膝关节周围"
	[/part]
	[part]
		id = "ankle"
		name = "踝"
		note= "踝关节周围"
	[/part]
	[part]
		id = "lower"
		name = "下肢"
		note= "泛指髋+腿+膝+踝（不可细分的统称"
	[/part]
	[part]
		id = "full"
		name = "全身"
		note= "涉及多个大部位，且无明显主次"
	[/part]
	[part]
		id = "spine"
		name = "脊柱"
		note= "泛指整条脊柱（颈椎+胸椎+腰椎"
	[/part]
[/body_part]

[movement_type]
	[type]
		id = "strength"
		name = "力量"
		note = "需要肌肉发力对抗阻力，包含等长、等张、向心、离心"
	[/type]
	[type]
		id = "stretch"
		name = "拉伸"
		note = "静态拉伸，保持姿势让肌肉延展"
	[/type]
	[type]
		id = "mobility"
		name = "灵活性/热身"
		note = "关节活动度训练，强调关节的主动活动"
	[/type]
	[type]
		id = "cardio"
		name = "有氧"
		note = "心率提升类，强调持续运动"
	[/type]
	[type]
		id = "balance"
		name = "平衡"
		note = "单腿或核心稳定训练，强调身体控制"
	[/type]
	[type]
		id = "rehab"
		name = "康复"
		note = "针对特定伤病或体态问题的矫正动作"
	[/type]
	[type]
		id = "plyometric"
		name = "爆发力"
		note = "快速伸缩复合训练，强调速度与爆发"
	[/type]
	[type]
		id = "isometric"
		name = "等长收缩"
		note = "保持姿势不动，肌肉持续发力"
	[/type]
	[type]
		id = "dynamic"
		name = "动态"
		note = "有节奏的重复动作，非静态保持"
	[/type]
	[type]
		id = "static"
		name = "静态"
		note = "保持一个固定姿势，不移动"
	[/type]
[/movement_type]

[action_tpl2]
	id = "plank_setup"
	name = "定位(平板撑)"
	msg = "xxx训练。手机摆在右侧，镜头跟身体平行，对准肚脐附近，放好手机后，原地趴下，保持不动，等待定位完成。"
	
		is_setup=true
		unsatisfied_2th_threshold_s=5
		unsatisfied_threshold_ms=800
		[track_pose]
			[pose]
				landmarks="12; 28"
				min=0.05
				name="画面方向确认"
				operand="x"
				type="diff"
				unsatisfied_msgstr="请掉转方向，让头在画面右侧"
			[/pose]
			[pose]
				landmarks="24; 1000"
				max=0.15
				min=-0.15
				name="右髋水平居中"
				operand="x"
				type="diff"
				unsatisfied_msgstr="往头侧移动，或反向移手机"
				unsatisfied_rmax_msgstr="往脚侧移动，或反向移手机"
			[/pose]
			[pose]
				abs=true
				landmarks="12; 28"
				max=0.65
				min=0.25
				name="全身画面占比"
				operand="x"
				type="diff"
				unsatisfied_msgstr="靠近或拉近镜头，别太小"
				unsatisfied_rmax_msgstr="后退或推远镜头，别太大"
			[/pose]
			[pose]
				landmarks="27,28; 1001"
				min=0.6
				name="(上)抬脚空间留白"
				operand="y"
				type="diff"
				unsatisfied_msgstr="上方留白不够，请抬高手机，或往后退"
			[/pose]
		[/track_pose]
		[task]
			max_count=5
			rule="strict"
			satisfied_threshold_s=3
			tone="full"
			type="time_counter"
		[/task]
[/action_tpl2]

