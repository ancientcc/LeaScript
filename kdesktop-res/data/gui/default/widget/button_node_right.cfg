#textdomain rose-lib
###
### Definition of the node button.
###

#define _GUI_TEXT FONT_SIZE FONT_COLOR LEFT_OFFSET
	[text]
		x = "({LEFT_OFFSET})"
		y = {GUI__TEXT_VERTICALLY_CENTRED}
		w = "(text_width)"
		h =  "(text_height)"
		color = {FONT_COLOR}
		text = "(text)"
	[/text]
#enddef

#define GUI__ICON_X ICON_WIDTH RIGHT_OFFSET
 	(if({ICON_WIDTH} < width, (width - {ICON_WIDTH} - {RIGHT_OFFSET}), 0))
#enddef

#define _GUI_RESOLUTION RESOLUTION HEIGHT EXTRA_WIDTH SPACE_WIDTH FONT_SIZE
	[resolution]

		{RESOLUTION}
		
		min_width = 0
		min_height = {HEIGHT}

		extra_width = {EXTRA_WIDTH}
		text_space_width = {SPACE_WIDTH}

		[state_enabled]

			[draw]
				
				[image]
					x = {GUI__ICON_X (extra_width) 0}
					y = "(if(height < extra_width, 0, (height - extra_width) / 2))"
					w = "(extra_width)"
					h = "(extra_width)"
					name = "(icon)"
				[/image]

				{_GUI_TEXT ({FONT_SIZE}) ({GUI__FONT_COLOR_ENABLED__DEFAULT}) 0}

			[/draw]

		[/state_enabled]

		[state_disabled]

			[draw]

				[image]
					x = {GUI__ICON_X (extra_width) 0}
					y = "(if(height < extra_width, 0, (height - extra_width) / 2))"
					w = "(extra_width)"
					h = "(extra_width)"
					name = "(icon)"
				[/image]

				{_GUI_TEXT ({FONT_SIZE}) ({GUI__FONT_COLOR_DISABLED__DEFAULT}) 0}

			[/draw]

		[/state_disabled]

		[state_pressed]

			[draw]

				[image]
					x = {GUI__ICON_X (extra_width) 0}
					y = "(if(height < extra_width, 0, (height - extra_width) / 2))"
					w = "(extra_width)"
					h = "(extra_width)"
					name = "(icon)"
				[/image]

				{_GUI_TEXT ({FONT_SIZE}) ({GUI__FONT_COLOR_ENABLED__DEFAULT}) 0}

			[/draw]

		[/state_pressed]

		[state_focussed]

			[draw]

				[image]
					x = {GUI__ICON_X (extra_width) 0}
					y = "(if(height < extra_width, 0, (height - extra_width) / 2))"
					w = "(extra_width)"
					h = "(extra_width)"
					name = "(icon)"
				[/image]

				{_GUI_TEXT ({FONT_SIZE}) ({GUI__FONT_COLOR_ENABLED__DEFAULT}) 0}

			[/draw]

		[/state_focussed]

	[/resolution]
#enddef

[button_definition]
	id = "node_right"
	description = "In horizontal, first text, second icon."

	# Tiny gui sizes haven't been tested yet so might need some tuning.
	{_GUI_RESOLUTION ()                        24 24 0 ({GUI_FONT_SIZE__DEFAULT}) }
[/button_definition]

#undef _GUI_RESOLUTION
