plugins {
    id 'com.android.application'
}

android {
    namespace 'com.leagor.kdesktop'
    compileSdk 35

    defaultConfig {
        applicationId "com.leagor.kdesktop"
        minSdk 26
        targetSdk 33
        versionCode 1
        versionName "1.0"

        // 从Android Studio3.5起，对要添加的第三方库，不仅是要在build.gradle文件的android节点下添加jniLibs.srcDirs，
        // 还要指定这些库支持哪些支持的指令集，在defaultConfig节点下添加，有多少加多少
        // 具体见：https://www.it72.com/12586.htm
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.appcompat:appcompat:1.3.0'
    implementation 'com.google.android.material:material:1.4.0'
}
