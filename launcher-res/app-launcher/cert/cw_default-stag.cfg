% 答案框样式（仅用于答案标记）
\newcommand{\answerbox}[1]{%
    \ifshowanswers
        \textbf{#1}% 去掉\fbox: \fbox{\textbf{#1}}
    \fi
}

% 填空题答案样式，双重数学模式嵌套是会报错的，这里#1不加$...$，让调用者决定是否使用数学模式
\newcommand{\fillinanswer}[1]{%
    \ifshowanswers
        \underline{\textcolor{blue}{\textbf{#1}}}%
    \else
        \underline{\hspace{2cm}}%
    \fi
}

% ======prompt header end

% 选择题正确答案标记（仅标记为蓝色加粗，不加框）
\newcommand{\correctchoice}[1]{\choice{\textcolor{blue}{\textbf{#1}}}}

\newcommand{\checkoptionA}[1]{%
    \ifnum#1=1 \correctchoice{A}\else
    \ifnum#1=12 \correctchoice{A}\else
    \ifnum#1=13 \correctchoice{A}\else
    \ifnum#1=14 \correctchoice{A}\else
    \ifnum#1=123 \correctchoice{A}\else
    \ifnum#1=124 \correctchoice{A}\else
    \ifnum#1=134 \correctchoice{A}\else
    \ifnum#1=1234 \correctchoice{A}\else
    \choice{A}\fi\fi\fi\fi\fi\fi\fi\fi
}

\newcommand{\checkoptionB}[1]{%
    \ifnum#1=2 \correctchoice{B}\else
    \ifnum#1=12 \correctchoice{B}\else
    \ifnum#1=23 \correctchoice{B}\else
    \ifnum#1=24 \correctchoice{B}\else
    \ifnum#1=123 \correctchoice{B}\else
    \ifnum#1=124 \correctchoice{B}\else
    \ifnum#1=234 \correctchoice{B}\else
    \ifnum#1=1234 \correctchoice{B}\else
    \choice{B}\fi\fi\fi\fi\fi\fi\fi\fi
}

\newcommand{\checkoptionC}[1]{%
    \ifnum#1=3 \correctchoice{C}\else
    \ifnum#1=13 \correctchoice{C}\else
    \ifnum#1=23 \correctchoice{C}\else
    \ifnum#1=34 \correctchoice{C}\else
    \ifnum#1=123 \correctchoice{C}\else
    \ifnum#1=134 \correctchoice{C}\else
    \ifnum#1=234 \correctchoice{C}\else
    \ifnum#1=1234 \correctchoice{C}\else
    \choice{C}\fi\fi\fi\fi\fi\fi\fi\fi
}

\newcommand{\checkoptionD}[1]{%
    \ifnum#1=4 \correctchoice{D}\else
    \ifnum#1=14 \correctchoice{D}\else
    \ifnum#1=24 \correctchoice{D}\else
    \ifnum#1=34 \correctchoice{D}\else
    \ifnum#1=124 \correctchoice{D}\else
    \ifnum#1=134 \correctchoice{D}\else
    \ifnum#1=234 \correctchoice{D}\else
    \ifnum#1=1234 \correctchoice{D}\else
    \choice{D}\fi\fi\fi\fi\fi\fi\fi\fi
}

% 设置选择题选项的格式
\newcommand{\choice}[1]{\makebox[1.5em][l]{(#1)}}

% 带答案的onechoices命令：每行1个选项
\newcommand{\onechoiceswithanswerA}[5]{ %
    \noindent
    \begin{minipage}[t]{\textwidth}
        \begin{minipage}[t]{\textwidth}
            \ifshowanswers
                \checkoptionA{#5} #1
            \else
                \choice{A} #1
            \fi
        \end{minipage}%

        \vspace{0.3em}

        \begin{minipage}[t]{\textwidth}
            \ifshowanswers
                \checkoptionB{#5} #2
            \else
                \choice{B} #2
            \fi
        \end{minipage}
        
        \vspace{0.3em}
        
        \begin{minipage}[t]{\textwidth}
            \ifshowanswers
                \checkoptionC{#5} #3
            \else
                \choice{C} #3
            \fi
        \end{minipage}%

        \vspace{0.3em}

        \begin{minipage}[t]{\textwidth}
            \ifshowanswers
                \checkoptionD{#5} #4
            \else
                \choice{D} #4
            \fi
        \end{minipage}
    \end{minipage}
}

% 修改：带答案的twochoices命令，答案行移到解析之后
\newcommand{\twochoiceswithanswerA}[5]{ %
    \noindent
    \begin{minipage}[t]{\textwidth}
        \begin{minipage}[t]{0.48\textwidth}
            \ifshowanswers
                \checkoptionA{#5} #1
            \else
                \choice{A} #1
            \fi
        \end{minipage}%
        \hfill
        \begin{minipage}[t]{0.48\textwidth}
            \ifshowanswers
                \checkoptionB{#5} #2
            \else
                \choice{B} #2
            \fi
        \end{minipage}
        
        \vspace{0.5em}
        
        \begin{minipage}[t]{0.48\textwidth}
            \ifshowanswers
                \checkoptionC{#5} #3
            \else
                \choice{C} #3
            \fi
        \end{minipage}%
        \hfill
        \begin{minipage}[t]{0.48\textwidth}
            \ifshowanswers
                \checkoptionD{#5} #4
            \else
                \choice{D} #4
            \fi
        \end{minipage}
    \end{minipage}
}

% 单独显示答案和解析的命令
\newcommand{\showanswerandexplanation}[2]{ %
    \ifshowanswers
    \vspace{0.3em}
    \noindent\textcolor{blue}{\textbf{解析：}} #2
    
    \vspace{0.2em}
    \noindent\textcolor{blue}{\textbf{答案：}\answerbox{\parsemultipleanswers{#1}}}
    \fi
}

% 解析多选题答案
\newcommand{\parsemultipleanswers}[1]{%
    \ifnum#1=1 A\fi
    \ifnum#1=2 B\fi
    \ifnum#1=3 C\fi
    \ifnum#1=4 D\fi
    \ifnum#1=12 A,B\fi
    \ifnum#1=13 A,C\fi
    \ifnum#1=14 A,D\fi
    \ifnum#1=23 B,C\fi
    \ifnum#1=24 B,D\fi
    \ifnum#1=34 C,D\fi
    \ifnum#1=123 A,B,C\fi
    \ifnum#1=124 A,B,D\fi
    \ifnum#1=134 A,C,D\fi
    \ifnum#1=234 B,C,D\fi
    \ifnum#1=1234 A,B,C,D\fi
}

\newcommand{\onechoiceswithanswerB}[6]{ %
    \onechoiceswithanswerA{#1}{#2}{#3}{#4}{#5}

     % 不管minipage内部布局出来会有多长，那它都不会分页。解析可能较大，不要在解析外放minipage
    \showanswerandexplanation{#5}{#6}
}

\newcommand{\twochoiceswithanswerB}[6]{ %
    \twochoiceswithanswerA{#1}{#2}{#3}{#4}{#5}

    % 不管minipage内部布局出来会有多长，那它都不会分页。解析可能较大，不要在解析外放minipage
    \showanswerandexplanation{#5}{#6}
}

% 单独显示解析的命令，一般用于填空题中的解析
\newcommand{\showexplanationforfillin}[1]{ %
    \ifshowanswers
    \vspace{0.3em}
    \noindent\textcolor{blue}{\textbf{解析：}}  #1
    \fi
}

% 单独显示解析的命令，一般用于解答题中的解析
\newcommand{\showexplanationforsolving}[2][3in]{ %
    % 方法：直接显示解答，不使用solutionorbox
    \ifshowanswers
    \vspace{0.3em}
    \noindent\textcolor{red}{\textbf{【解答过程】}}
    
    \noindent #2
    
    \else
    % 学生版：使用solutionorbox留出答题空间
    \begin{solutionorbox}[#1]
        % 学生版留空
    \end{solutionorbox}
    \fi
}

