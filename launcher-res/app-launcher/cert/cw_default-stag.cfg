	exercise_answer = "    % \vspace{\stretch{0.2}}
    \vspace{0.3em}"
    
	rstr_format = "制做一张试卷，题型分选择题、填空题和解答题。题目、选择题选项、答案解析、以及解答过程，用latex语法，但不是一个完整tex文本，而是以着下面格式分散到相应位置。上面是写latex语句时可用的宏包，以及可用的新加命令。不要用“\newcommand”新加命令。
/*
{choice}(换行)
分数(换行)
[**&question##@]题目[**&question##@](换行)
[**&opt##@]选项A内容[**&opt##@](换行)
[**&opt##@]选项B内容[**&opt##@](换行)
[**&opt##@]选项C内容[**&opt##@](换行)
[**&opt##@]选项D内容[**&opt##@](换行)
[**&expl##@]答案解析[**&expl##@](换行)
正确选项(换行)
*/
以上是选择题格式。“{choice}”表示这是选择题。“(换行)”表示换行符'\n'。“题目”是该题的题目。选项有A、B、C、D四个，每个选项包括三个部分，前缀字符串[**&opt##@]、选项内容和后缀字符串[**&opt##@]。“答案解析”是填写答案解析过程。正确选项填正确选项是哪个，A表示正确答案是A选项，B表示是B，C表示是C，D表示是D，是多选题时，选项中间用英文逗号（,）隔开。[**&question##@]、[**&opt##@]、[**&expl##@]等，是要加的前缀、后缀，内容固定。字符串“/*”、“*/”是为方便描述加的，不是格式一部分，以下表示的格式也一样。

/*
{fillin}(换行)
分数(换行)
[**&question##@]题目[**&question##@](换行)
[**&expl##@]答案解析[**&expl##@](换行)
*/
以上是填空题格式。“{fillin}”表示这是填空题。题目中要填部分用“\fillinanswer{xx}”表示，“xx”是正确答案

对解答题，分两种情况。第一种情况，没有小题
/*
{solving}(换行)
分数(换行)
[**&question##@]大题题目[**&question##@](换行)
[**&expl##@]解答过程[**&expl##@](换行)
*/
以上是没有小题的解答题格式。{solving}表示这是一道解答题。这里的分数对应大题分数。

第二种情况，有分小题，此时需要先写大题，再写N个小题。
/*
{solving}(换行)
分数(换行)
[**&question##@]大题题目[**&question##@](换行)
*/
以上是有小题时的大题格式。分数对应各小题总分数。

对每道小题格式，如果小题是选择题，参照上面选择题格式。如果是填空题，参照上面填空题格式。不是这两种时，用以下格式，标识字符串是“{other}”。
/*
{other}(换行)
分数(换行)
[**&question##@]题目[**&question##@](换行)
[**&expl##@]解答过程[**&expl##@](换行)
*/"  
