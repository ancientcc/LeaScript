
categories = "mathematics, physics, chemistry"

[formula]
	category = "mathematics"
	
	name = "伯努利不等式"
	tex = "$(1 + x)^n \geqslant 1 + nx \quad (x > -1, \ n \in \mathbb{N}^+ )$"
[/formula]

[formula]
	category = "mathematics"
	
	name = "二次不等式（判别式）"
	tex = "$ax^2 + bx + c \geqslant 0 \text{ 或 } ax^2 + bx + c \leqslant 0$"
[/formula]

[formula]
	category = "mathematics"
	
	name = "柯西不等式（均方根不等式）"
	tex = "$(a_1^2 + a_2^2 + \cdots + a_n^2)(b_1^2 + b_2^2 + \cdots + b_n^2) \geqslant (a_1b_1 + a_2b_2 + \cdots + a_nb_n)^2$"
[/formula]

[formula]
	category = "mathematics"
	
	name = "洛必达法则（极限不等式）"
	tex = "$\lim_{x \to a} \frac{f(x)}{g(x)} = \lim_{x \to a} \frac{f'(x)}{g'(x)} \quad \text{当 } g'(x) \neq 0$"
[/formula]