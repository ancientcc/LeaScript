[var_sensor]
	at=0
	name="坐姿检测"
	sync_vars="aplt.launcher.fake__env_basesubtask_code_"
	[if_block]
		[branch]
			do_bool_set="set_true"
			do_str=""
			do_to_state=-1
			[judge]
				op="numerical_not_equal"
				r_exp=0
				var_exp="$aplt.launcher.fake__env_basesubtask_code_"
			[/judge]
		[/branch]
		[branch]
			do_bool_set="set_none"
			do_str=""
			do_to_state=-1
		[/branch]
	[/if_block]
[/var_sensor]
[var_sensor]
	at=1
	name="处理按键"
	sync_vars="aplt.launcher.fake__env_button_code_"
	[if_block]
		[branch]
			do_bool_set="set_true"
			do_str=""
			do_to_state=-1
			[judge]
				op="numerical_not_equal"
				r_exp=0
				var_exp="$aplt.launcher.fake__env_button_code_"
			[/judge]
		[/branch]
		[branch]
			do_bool_set="set_none"
			do_str=""
			do_to_state=-1
		[/branch]
	[/if_block]
[/var_sensor]
[var_sensor]
	at=2
	name="点读笔"
	sync_vars="aplt.launcher.fake__env_ocr_pen_code_"
	[if_block]
		[branch]
			do_bool_set="set_true"
			do_str=""
			do_to_state=-1
			[judge]
				op="numerical_not_equal"
				r_exp=0
				var_exp="$aplt.launcher.fake__env_ocr_pen_code_"
			[/judge]
		[/branch]
		[branch]
			do_bool_set="set_none"
			do_str=""
			do_to_state=-1
		[/branch]
	[/if_block]
[/var_sensor]
[var_sensor]
	at=3
	name="隔1小时执行"
	sync_vars="aplt.launcher.fake__env_hour24_time1_last_"
	[if_block]
		[branch]
			do_bool_set="set_none"
			do_str=""
			do_to_state=-1
			[judge]
				op="less_than"
				r_exp=25200
				var_exp="$aplt.launcher.fake__env_hour24_time_"
			[/judge]
			[judge]
				logic="or"
				op="greater_than"
				r_exp=79200
				var_exp="$aplt.launcher.fake__env_hour24_time_"
			[/judge]
		[/branch]
		[branch]
			do_bool_set="set_true"
			do_str=""
			do_to_state=-1
			[map_vals]
				iot_alias_="TB5-大厅1号桌(B铃)"
			[/map_vals]
			[judge]
				op="numerical_not_equal"
				r_exp="$(div, $aplt.launcher.fake__env_hour24_time_, 3600)"
				var_exp="$(div, $aplt.launcher.fake__env_hour24_time1_last_, 3600)"
			[/judge]
		[/branch]
		[branch]
			do_bool_set="set_none"
			do_str=""
			do_to_state=-1
		[/branch]
	[/if_block]
[/var_sensor]
[var_sensor]
	at=4
	name="隔1分执行"
	sync_vars="aplt.launcher.fake__env_hour24_time2_last_"
	[if_block]
		[branch]
			do_bool_set="set_none"
			do_str=""
			do_to_state=-1
			[judge]
				op="less_than"
				r_exp=25200
				var_exp="$aplt.launcher.fake__env_hour24_time_"
			[/judge]
			[judge]
				logic="or"
				op="greater_than"
				r_exp=79200
				var_exp="$aplt.launcher.fake__env_hour24_time_"
			[/judge]
		[/branch]
		[branch]
			do_bool_set="set_true"
			do_str=""
			do_to_state=-1
			[map_vals]
				iot_alias_="TB5-大厅1号桌(B铃)"
			[/map_vals]
			[judge]
				op="numerical_not_equal"
				r_exp="$(div, $aplt.launcher.fake__env_hour24_time_, 60)"
				var_exp="$(div, $aplt.launcher.fake__env_hour24_time2_last_, 60)"
			[/judge]
		[/branch]
		[branch]
			do_bool_set="set_none"
			do_str=""
			do_to_state=-1
		[/branch]
	[/if_block]
[/var_sensor]
