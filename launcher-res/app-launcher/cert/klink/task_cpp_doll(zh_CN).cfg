[task_cpp]
	id="bedside"
	name="起床、睡觉"
	nonpreemptive=false
	reception_state=-1
	recoverable=true
	[startup_state]
		[branch]
			do_bool_set="set_none"
			do_str=""
			do_to_state=0
			[judge]
				op="greater_than_equal_to"
				r_exp=21600
				var_exp="$aplt.launcher.fake__env_hour24_time_"
			[/judge]
			[judge]
				logic="and"
				op="less_than_equal_to"
				r_exp=32400
				var_exp="$aplt.launcher.fake__env_hour24_time_"
			[/judge]
		[/branch]
		[branch]
			do_bool_set="set_none"
			do_str=""
			do_to_state=1
			[judge]
				op="greater_than_equal_to"
				r_exp=75600
				var_exp="$aplt.launcher.fake__env_hour24_time_"
			[/judge]
			[judge]
				logic="or"
				op="less_than_equal_to"
				r_exp=7200
				var_exp="$aplt.launcher.fake__env_hour24_time_"
			[/judge]
		[/branch]
		[branch]
