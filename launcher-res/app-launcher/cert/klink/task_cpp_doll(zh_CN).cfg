			[branch]
				do_bool_set="set_none"
				do_str="被中断，或预定时间内等不到答案"
				do_to_state=-1
				[judge]
					op="var_not_exist"
					var_exp="$aplt.leagor.khome__ds_retbool"
				[/judge]
			[/branch]
			[branch]
				do_bool_set="set_none"
				do_str="$aplt.leagor.khome__ds_answer"
				do_to_state=-1
