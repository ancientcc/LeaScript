#textdomain launcher-lib

[window]
	app="launcher"
	id="dcamera"
	[resolution]
		{GUI__COMMON_FLOAT_WIDGETS}
		automatic_placement=false
		definition="scale_screen"
		height="(screen_height)"
		width="(screen_width)"
		x="(0)"
		y="(0)"
		[grid]
			[row]
				[column]
					[spacer]
						definition="default"
						height="(statusbar_height)"
					[/spacer]
				[/column]
			[/row]
			[row]
				[column]
					horizontal_alignment="edge"
					[rose__statusbar]
						id="statusbar"
					[/rose__statusbar]
				[/column]
			[/row]
			[row]
				[column]
					horizontal_alignment="edge"
					[grid]
						[row]
							[column]
								horizontal_alignment="left"
								[button]
									definition="icon36"
									id="cancel"
									label="misc/back.png"
								[/button]
							[/column]
							[column]
								horizontal_alignment="left"
								[label]
									definition="default"
									height="(32)"
									id="set_ik_diff"
									state=1
									text_font_size=998
									width="(192)"
								[/label]
							[/column]
							[column]
								grow_factor=1
								[label]
									definition="default"
									id="title"
									text_font_size=1001
								[/label]
							[/column]
							[column]
								border="right"
								border_size=4
								horizontal_alignment="edge"
								[button]
									definition="dropdown"
									id="moveit_aplt"
									min_text_width="(192)"
								[/button]
							[/column]
							[column]
								[button]
									definition="icon36"
									id="start"
									label="misc/start.png"
								[/button]
							[/column]
						[/row]
					[/grid]
				[/column]
			[/row]
			[row]
				[column]
					border="left, right"
					border_size=8
					horizontal_alignment="left"
					[label]
						definition="default"
						id="warnning"
						mtwusc=true
						text_font_size=998
					[/label]
				[/column]
			[/row]
			[row]
				grow_factor=1
				[column]
					horizontal_alignment="edge"
					vertical_alignment="edge"
					[panel]
						definition="default"
						[grid]
							[row]
								[column]
									grow_factor=1
									horizontal_alignment="edge"
									vertical_alignment="edge"
									[track]
										definition="default"
										id="paper"
									[/track]
								[/column]
								[column]
									border="left"
									border_size=4
									vertical_alignment="edge"
									[grid]
										id="ctrl_grid"
										[row]
											[column]
												horizontal_alignment="edge"
												[button]
													definition="dropdown"
													id="dctask"
													label=_"View"
												[/button]
											[/column]
										[/row]
										[row]
											[column]
												horizontal_alignment="edge"
												[button]
													definition="dropdown"
													id="snapshot_depth"
													label="Snapshot depth"
												[/button]
											[/column]
										[/row]
										[row]
											[column]
												horizontal_alignment="edge"
												[button]
													definition="dropdown"
													id="snapshot"
													label=_"camera^Snapshot"
												[/button]
											[/column]
										[/row]
										[row]
											[column]
												horizontal_alignment="edge"
												[button]
													definition="dropdown"
													id="reach_dcpitch"
													label="Reach dcpitch"
												[/button]
											[/column]
										[/row]
										[row]
											[column]
												horizontal_alignment="edge"
												[button]
													definition="dropdown"
													id="dbg"
													label=_"Dbg"
												[/button]
											[/column]
										[/row]
									[/grid]
								[/column]
							[/row]
						[/grid]
					[/panel]
				[/column]
			[/row]
			[row]
				[column]
					border="left, right"
					border_size=8
					horizontal_alignment="left"
					[label]
						definition="default"
						id="pickplace_msg"
						mtwusc=true
						state=1
						text_font_size=998
					[/label]
				[/column]
			[/row]
			[row]
				[column]
					horizontal_alignment="edge"
					[grid]
						[row]
							[column]
								border="left, right"
								border_size=8
								grow_factor=1
								horizontal_alignment="left"
								[label]
									definition="default"
									id="camera_k"
									mtwusc=true
									state=1
									text_font_size=998
								[/label]
							[/column]
							[column]
								[label]
									definition="default"
									height="(18)"
									id="rpy"
									state=1
									text_font_size=998
									width="(192)"
								[/label]
							[/column]
						[/row]
					[/grid]
				[/column]
			[/row]
		[/grid]
	[/resolution]
[/window]
