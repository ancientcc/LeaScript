#textdomain launcher-lib

[window]
	app="launcher"
	id="import2"
	[resolution]
		{GUI__COMMON_FLOAT_WIDGETS}
		automatic_placement=false
		definition="scale_screen"
		height="(screen_height)"
		width="(screen_width)"
		x="(0)"
		y="(0)"
		[grid]
			[row]
				[column]
					[spacer]
						definition="default"
						height="(statusbar_height)"
					[/spacer]
				[/column]
			[/row]
			[row]
				[column]
					horizontal_alignment="edge"
					[rose__statusbar]
						id="statusbar"
					[/rose__statusbar]
				[/column]
			[/row]
			[row]
				[column]
					horizontal_alignment="edge"
					[grid]
						[row]
							[column]
								[button]
									definition="icon36"
									id="ok"
									label="misc/back.png"
								[/button]
							[/column]
							[column]
								grow_factor=1
								[label]
									definition="default"
									id="title"
								[/label]
							[/column]
							[column]
								[spacer]
									definition="default"
									width="(36)"
								[/spacer]
							[/column]
						[/row]
					[/grid]
				[/column]
			[/row]
			[row]
				[column]
					border="left, right"
					border_size=8
					horizontal_alignment="left"
					[label]
						definition="default"
						id="remark"
						mtwusc=true
						state=1
						text_font_size=998
					[/label]
				[/column]
			[/row]
			[row]
				[column]
					border="all"
					border_size=8
					horizontal_alignment="edge"
					[listbox]
						definition="default"
						horizontal_scrollbar_mode="never"
						id="product_list"
						width="(0)"
						[list_definition]
							[row]
								[column]
									[toggle_panel]
										definition="default"
										[grid]
											[row]
												[column]
													[spacer]
														definition="default"
														height="(36)"
													[/spacer]
												[/column]
												[column]
													grow_factor=1
													horizontal_alignment="left"
													[label]
														definition="default"
														id="name"
														mtwusc=true
													[/label]
												[/column]
											[/row]
										[/grid]
									[/toggle_panel]
								[/column]
							[/row]
						[/list_definition]
					[/listbox]
				[/column]
			[/row]
			[row]
				[column]
					border="left, right, top"
					border_size=8
					horizontal_alignment="right"
					[button]
						definition="default"
						id="import"
						label=_"Import"
					[/button]
				[/column]
			[/row]
			[row]
				grow_factor=1
				[column]
					[spacer]
						definition="default"
					[/spacer]
				[/column]
			[/row]
		[/grid]
	[/resolution]
[/window]
