#textdomain launcher-lib

[window]
	app="launcher"
	id="new_wkocourse"
	[resolution]
		{GUI__COMMON_FLOAT_WIDGETS}
		automatic_placement=false
		definition="scale_screen"
		height="(screen_height)"
		width="(screen_width)"
		x="(0)"
		y="(0)"
		[grid]
			[row]
				[column]
					[spacer]
						definition="default"
						height="(statusbar_height)"
					[/spacer]
				[/column]
			[/row]
			[row]
				[column]
					horizontal_alignment="edge"
					[rose__statusbar]
						id="statusbar"
					[/rose__statusbar]
				[/column]
			[/row]
			[row]
				[column]
					horizontal_alignment="edge"
					[panel]
						definition="default"
						[grid]
							[row]
								[column]
									[button]
										definition="node"
										id="back"
										label=_"Next step"
									[/button]
								[/column]
								[column]
									grow_factor=1
									[label]
										definition="default"
										id="title"
									[/label]
								[/column]
								[column]
									[button]
										definition="text"
										id="cancel"
										label=_"Cancel"
									[/button]
								[/column]
							[/row]
						[/grid]
					[/panel]
				[/column]
			[/row]
			[row]
				[column]
					border="left, right, bottom"
					border_size=8
					horizontal_alignment="edge"
					[grid]
						id="remark_grid"
						[row]
							[column]
								border="right"
								border_size=8
								[button]
									definition="icon36"
									id="working_dir"
									label="buttons/working_dir.png"
								[/button]
							[/column]
							[column]
								grow_factor=1
								horizontal_alignment="left"
								[label]
									definition="default"
									id="remark"
									mtwusc=true
									state=1
									text_font_size=999
								[/label]
							[/column]
						[/row]
					[/grid]
				[/column]
			[/row]
			[row]
				[column]
					border="all"
					border_size=8
					horizontal_alignment="edge"
					[grid]
						id="legend_grid"
						[row]
							[column]
								border="right"
								border_size=8
								[image]
									definition="default"
									height="(16)"
									id="legend_png0"
									width="(16)"
								[/image]
							[/column]
							[column]
								grow_factor=1
								horizontal_alignment="left"
								[label]
									definition="default"
									id="legend_msgstr0"
									state=1
									text_font_size=999
								[/label]
							[/column]
							[column]
								border="right"
								border_size=8
								[image]
									definition="default"
									height="(16)"
									id="legend_png1"
									width="(16)"
								[/image]
							[/column]
							[column]
								grow_factor=1
								horizontal_alignment="left"
								[label]
									definition="default"
									id="legend_msgstr1"
									state=1
									text_font_size=999
								[/label]
							[/column]
						[/row]
						[row]
							[column]
								border="right"
								border_size=8
								[image]
									definition="default"
									height="(16)"
									id="legend_png2"
									width="(16)"
								[/image]
							[/column]
							[column]
								horizontal_alignment="left"
								[label]
									definition="default"
									id="legend_msgstr2"
									state=1
									text_font_size=999
								[/label]
							[/column]
							[column]
								border="right"
								border_size=8
								[image]
									definition="default"
									height="(16)"
									id="legend_png3"
									width="(16)"
								[/image]
							[/column]
							[column]
								horizontal_alignment="left"
								[label]
									definition="default"
									id="legend_msgstr3"
									state=1
									text_font_size=999
								[/label]
							[/column]
						[/row]
					[/grid]
				[/column]
			[/row]
			[row]
				grow_factor=1
				[column]
					border="left, right"
					border_size=8
					horizontal_alignment="edge"
					vertical_alignment="edge"
					[listbox]
						definition="default"
						height="(0)"
						horizontal_scrollbar_mode="never"
						id="file_list"
						width="(0)"
						[linked_group]
							fixed_width=true
							id="number"
						[/linked_group]
						[linked_group]
							fixed_width=true
							id="title"
						[/linked_group]
						[linked_group]
							fixed_width=true
							id="method"
						[/linked_group]
						[list_definition]
							[row]
								[column]
									[toggle_panel]
										definition="default"
										[grid]
											[row]
												[column]
													horizontal_alignment="edge"
													[grid]
														id="type_grid"
														[row]
															[column]
																border="top"
																border_size=8
																horizontal_alignment="left"
																[label]
																	definition="default"
																	id="type"
																	state=1
																	text_font_size=1001
																[/label]
															[/column]
														[/row]
													[/grid]
												[/column]
											[/row]
											[row]
												[column]
													horizontal_alignment="edge"
													[grid]
														id="file_grid"
														[row]
															[column]
																border="right"
																border_size=8
																[label]
																	definition="default"
																	id="number"
																	linked_group="number"
																	state=1
																[/label]
															[/column]
															[column]
																border="right"
																border_size=8
																[image]
																	definition="default"
																	height="(16)"
																	id="flag"
																	width="(16)"
																[/image]
															[/column]
															[column]
																border="right"
																border_size=16
																[label]
																	definition="default"
																	id="title"
																	linked_group="title"
																[/label]
															[/column]
															[column]
																border="right"
																border_size=16
																[label]
																	definition="default"
																	id="method"
																	linked_group="method"
																	state=1
																[/label]
															[/column]
															[column]
																border="right"
																border_size=8
																grow_factor=1
																horizontal_alignment="left"
																[label]
																	definition="default"
																	id="file"
																	mtwusc=true
																	state=1
																[/label]
															[/column]
														[/row]
													[/grid]
												[/column]
											[/row]
											[row]
												[column]
													border="top, bottom"
													border_size=4
													horizontal_alignment="edge"
													[image]
														definition="default"
														label="misc/split_line.png"
													[/image]
												[/column]
											[/row]
										[/grid]
									[/toggle_panel]
								[/column]
							[/row]
						[/list_definition]
					[/listbox]
				[/column]
			[/row]
			[row]
				[column]
					border="left, right"
					border_size=8
					horizontal_alignment="left"
					[label]
						definition="default"
						id="next_action"
						mtwusc=true
						text_font_size=998
					[/label]
				[/column]
			[/row]
		[/grid]
	[/resolution]
[/window]
