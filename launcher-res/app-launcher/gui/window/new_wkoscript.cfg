#textdomain launcher-lib

[window]
	app="launcher"
	id="new_wkoscript"
	[resolution]
		{GUI__COMMON_FLOAT_WIDGETS}
		automatic_placement=false
		definition="scale_screen"
		height="(screen_height)"
		width="(screen_width)"
		x="(0)"
		y="(0)"
		[grid]
			[row]
				[column]
					[spacer]
						definition="default"
						height="(statusbar_height)"
					[/spacer]
				[/column]
			[/row]
			[row]
				[column]
					horizontal_alignment="edge"
					[rose__statusbar]
						id="statusbar"
					[/rose__statusbar]
				[/column]
			[/row]
			[row]
				[column]
					horizontal_alignment="edge"
					[panel]
						definition="default"
						[grid]
							[row]
								[column]
									[button]
										definition="node"
										id="back"
										label=_"Next step"
									[/button]
								[/column]
								[column]
									grow_factor=1
									[label]
										definition="default"
										id="title"
									[/label]
								[/column]
								[column]
									[button]
										definition="text"
										id="cancel"
										label=_"Cancel"
									[/button]
								[/column]
							[/row]
						[/grid]
					[/panel]
				[/column]
			[/row]
			[row]
				[column]
					border="left, right"
					border_size=8
					horizontal_alignment="left"
					[label]
						definition="default"
						id="remark"
						mtwusc=true
						state=1
						text_font_size=999
					[/label]
				[/column]
			[/row]
			[row]
				[column]
					border="left, right, bottom"
					border_size=8
					horizontal_alignment="edge"
					[grid]
						[row]
							[column]
								border="right"
								border_size=8
								[button]
									definition="icon36"
									id="working_dir"
									label="buttons/working_dir.png"
								[/button]
							[/column]
							[column]
								border="right"
								border_size=8
								horizontal_alignment="left"
								[button]
									definition="dropdown"
									id="new_dirs"
									width="(screen_width * 25 / 100)"
								[/button]
							[/column]
							[column]
								[label]
									definition="default"
									label=_"Camera position"
								[/label]
							[/column]
							[column]
								border="right"
								border_size=8
								grow_factor=1
								horizontal_alignment="edge"
								[report]
									definition="default"
									gap=8
									horizontal_scrollbar_mode="never"
									id="cam_position"
									toggle=true
									unit_definition="default"
									unit_height="(0)"
									unit_width="(0)"
								[/report]
							[/column]
							[column]
								horizontal_alignment="left"
								[button]
									definition="default"
									id="generate"
									label=_"Generate script"
								[/button]
							[/column]
						[/row]
					[/grid]
				[/column]
			[/row]
			[row]
				grow_factor=1
				[column]
					border="left, right, bottom"
					border_size=8
					horizontal_alignment="edge"
					vertical_alignment="edge"
					[listbox]
						definition="default"
						height="(0)"
						horizontal_scrollbar_mode="never"
						id="action_list"
						width="(0)"
						[linked_group]
							fixed_width=true
							id="number"
						[/linked_group]
						[linked_group]
							fixed_width=true
							id="task"
						[/linked_group]
						[header]
							[row]
								[column]
									border="right"
									border_size=8
									[label]
										definition="default"
										label=_"Action No."
										linked_group="number"
									[/label]
								[/column]
								[column]
									border="right"
									border_size=8
									[label]
										definition="default"
										label=_"Task"
										linked_group="task"
									[/label]
								[/column]
								[column]
									grow_factor=1
									[label]
										definition="default"
									[/label]
								[/column]
							[/row]
						[/header]
						[list_definition]
							[row]
								[column]
									[toggle_panel]
										definition="default"
										[grid]
											[row]
												[column]
													horizontal_alignment="edge"
													[grid]
														[row]
															[column]
																border="right"
																border_size=8
																[label]
																	definition="default"
																	id="number"
																	linked_group="number"
																[/label]
															[/column]
															[column]
																border="right"
																border_size=8
																[label]
																	definition="default"
																	id="task"
																	linked_group="task"
																[/label]
															[/column]
															[column]
																grow_factor=1
																horizontal_alignment="edge"
																[grid]
																	[row]
																		[column]
																			border="right"
																			border_size=8
																			[button]
																				definition="blits"
																				height="(72)"
																				id="phase_png0"
																				width="(128)"
																			[/button]
																		[/column]
																		[column]
																			border="right"
																			border_size=8
																			[button]
																				definition="blits"
																				height="(72)"
																				id="phase_png1"
																				width="(128)"
																			[/button]
																		[/column]
																		[column]
																			grow_factor=1
																			[spacer]
																				definition="default"
																			[/spacer]
																		[/column]
																	[/row]
																[/grid]
															[/column]
														[/row]
													[/grid]
												[/column]
											[/row]
											[row]
												[column]
													border="bottom"
													border_size=4
													horizontal_alignment="edge"
													[image]
														definition="default"
														label="misc/split_line.png"
													[/image]
												[/column]
											[/row]
										[/grid]
									[/toggle_panel]
								[/column]
							[/row]
						[/list_definition]
					[/listbox]
				[/column]
			[/row]
		[/grid]
	[/resolution]
[/window]
