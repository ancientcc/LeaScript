#textdomain launcher-lib

[window]
	app="launcher"
	id="time_setter"
	[resolution]
		{GUI__COMMON_FLOAT_WIDGETS}
		definition="default"
		[grid]
			[row]
				[column]
					horizontal_alignment="left"
					[label]
						definition="default"
						id="title"
						text_font_size=1001
					[/label]
				[/column]
			[/row]
			[row]
				[column]
					[spacer]
						definition="default"
						height="(8)"
						width="((if(screen_width < 640, screen_width * 70 / 100, 448)))"
					[/spacer]
				[/column]
			[/row]
			[row]
				[column]
					border="bottom"
					border_size=8
					horizontal_alignment="right"
					[label]
						definition="default"
						id="current_time"
						state=1
						text_font_size=1002
					[/label]
				[/column]
			[/row]
			[row]
				[column]
					horizontal_alignment="edge"
					[grid]
						[row]
							[column]
								grow_factor=1
								horizontal_alignment="edge"
								[button]
									definition="dropdown"
									id="hour"
								[/button]
							[/column]
							[column]
								border="left, right"
								border_size=8
								[label]
									definition="default"
									label=":"
									state=1
									text_font_size=1002
								[/label]
							[/column]
							[column]
								grow_factor=1
								horizontal_alignment="edge"
								[button]
									definition="dropdown"
									id="minute"
								[/button]
							[/column]
							[column]
								border="left, right"
								border_size=8
								[label]
									definition="default"
									label=":"
									state=1
									text_font_size=1002
								[/label]
							[/column]
							[column]
								border="right"
								border_size=8
								grow_factor=1
								horizontal_alignment="edge"
								[button]
									definition="dropdown"
									id="second"
								[/button]
							[/column]
						[/row]
					[/grid]
				[/column]
			[/row]
			[row]
				[column]
					border="top"
					border_size=8
					horizontal_alignment="edge"
					[grid]
						[row]
							[column]
								border="right"
								border_size=8
								horizontal_alignment="left"
								[label]
									definition="default"
									label=_"State"
								[/label]
							[/column]
							[column]
								border="right"
								border_size=8
								grow_factor=1
								horizontal_alignment="edge"
								[button]
									definition="dropdown"
									id="state"
								[/button]
							[/column]
						[/row]
					[/grid]
				[/column]
			[/row]
			[row]
				[column]
					[spacer]
						definition="default"
						height="(20)"
					[/spacer]
				[/column]
			[/row]
			[row]
				grow_factor=1
				[column]
					horizontal_alignment="edge"
					[grid]
						[row]
							[column]
								grow_factor=1
								[spacer]
									definition="default"
								[/spacer]
							[/column]
							[column]
								[button]
									definition="default"
									id="ok"
									label=_"OK"
								[/button]
							[/column]
							[column]
								[spacer]
									definition="default"
									width="(20)"
								[/spacer]
							[/column]
							[column]
								[button]
									definition="default"
									id="cancel"
									label=_"Cancel"
								[/button]
							[/column]
						[/row]
					[/grid]
				[/column]
			[/row]
		[/grid]
	[/resolution]
[/window]
