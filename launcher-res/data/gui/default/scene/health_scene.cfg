#textdomain rose-lib

[window]
	app="rose"
	id="health_scene"
	[resolution]
		{GUI__COMMON_FLOAT_WIDGETS}
		automatic_placement=false
		definition="null"
		height="(screen_height)"
		scene=true
		width="(screen_width)"
		x="(0)"
		y="(0)"
		[scene]
			tile_shape="square"
			[main_map_border]
				background_image="terrain-square/off-map/background.png"
				border_image_bottom_even="terrain-hexagonal/off-map/fade_border_bottom_even_editor.png"
				border_image_bottom_odd="terrain-hexagonal/off-map/fade_border_bottom_odd_editor.png"
				border_image_left="terrain-hexagonal/off-map/fade_border_left_editor.png"
				border_image_right="terrain-hexagonal/off-map/fade_border_right_editor.png"
				border_image_top_even="terrain-hexagonal/off-map/fade_border_top_even_editor.png"
				border_image_top_odd="terrain-hexagonal/off-map/fade_border_top_odd_editor.png"
				border_size=0
				corner_image_bottom_left="terrain-hexagonal/off-map/fade_corner_bottom_left_editor.png"
				corner_image_bottom_right_even="terrain-hexagonal/off-map/fade_corner_bottom_right_even_editor.png"
				corner_image_bottom_right_odd="terrain-hexagonal/off-map/fade_corner_bottom_right_odd_editor.png"
				corner_image_top_left="terrain-hexagonal/off-map/fade_corner_top_left_editor.png"
				corner_image_top_right_even="terrain-hexagonal/off-map/fade_corner_top_right_even_editor.png"
				corner_image_top_right_odd="terrain-hexagonal/off-map/fade_corner_top_right_odd_editor.png"
				tile_image="off-map/alpha.png"
				view_rectangle_color="blue"
			[/main_map_border]
		[/scene]
		[float_widget]
			ref="_main_map"
			x="(ref_width - width);0"
			y="(0);0"
			[button]
				definition="icon36"
				id="flt_to_top"
				label="misc/to_top.png"
			[/button]
		[/float_widget]
		[float_widget]
			ref="_main_map"
			x="(ref_width - width);0"
			y="(ref_height - height);0"
			[button]
				definition="icon36"
				id="flt_erase"
				label="misc/erase.png"
			[/button]
		[/float_widget]
		[grid]
			[row]
				[column]
					grow_factor=1
					horizontal_alignment="edge"
					[panel]
						bottom_margin=0
						definition="default"
						label="misc/bg_35343a.png"
						left_margin=0
						right_margin=0
						top_margin=0
						[grid]
							[row]
								[column]
									[spacer]
										definition="default"
										height="(statusbar_height)"
									[/spacer]
								[/column]
							[/row]
							[row]
								[column]
									[label]
										definition="default"
									[/label]
								[/column]
							[/row]
						[/grid]
					[/panel]
				[/column]
			[/row]
			[row]
				[column]
					horizontal_alignment="edge"
					[panel]
						bottom_margin=0
						definition="default"
						label="misc/bg_ffffff.png"
						left_margin=4
						right_margin=4
						top_margin=0
						[grid]
							[row]
								[column]
									horizontal_alignment="edge"
									[rose__statusbar]
										id="statusbar"
									[/rose__statusbar]
								[/column]
							[/row]
						[/grid]
					[/panel]
				[/column]
			[/row]
			[row]
				[column]
					horizontal_alignment="edge"
					[panel]
						definition="default"
						label="misc/bg_ffffff.png"
						[grid]
							[row]
								[column]
									horizontal_alignment="edge"
									[stack]
										definition="default"
										id="toolbar_stack"
										mode="radio"
										use_max_layer_best_size=true
										[layer]
											id="tb_normal_layer"
											[row]
												[column]
													[button]
														definition="icon36"
														id="return"
														label="misc/back.png"
													[/button]
												[/column]
												[column]
													grow_factor=1
													horizontal_alignment="edge"
													[report]
														definition="default"
														horizontal_scrollbar_mode="never"
														id="navigation_report"
														toggle=true
														unit_definition="text"
														unit_height="(0)"
														unit_width="(0)"
														width="(0)"
													[/report]
												[/column]
												[column]
													grow_factor=1
													horizontal_alignment="edge"
													vertical_alignment="edge"
													[image]
														definition="blits"
														id="_mini_map"
													[/image]
												[/column]
												[column]
													border="left, right"
													border_size=4
													[button]
														definition="icon36"
														id="test_lru"
														label="misc/debug.png"
													[/button]
												[/column]
												[column]
													border="right"
													border_size=4
													[button]
														definition="icon36"
														id="insert"
														label="misc/insert.png"
													[/button]
												[/column]
												[column]
													[button]
														definition="icon36"
														id="share"
														label="misc/share.png"
													[/button]
												[/column]
											[/row]
										[/layer]
										[layer]
											id="tb_share_layer"
											[row]
												[column]
													border="right"
													border_size=8
													[label]
														definition="default"
														id="which_charts"
													[/label]
												[/column]
												[column]
													border="right"
													border_size=8
													grow_factor=1
													horizontal_alignment="edge"
													[rose__text_box2]
														id="watermark"
													[/rose__text_box2]
												[/column]
												[column]
													border="right"
													border_size=12
													[button]
														definition="text"
														id="cancel2"
														label=_"Cancel"
													[/button]
												[/column]
												[column]
													[button]
														definition="default"
														id="ok2"
														label=_"Save"
													[/button]
												[/column]
											[/row]
										[/layer]
									[/stack]
								[/column]
							[/row]
						[/grid]
					[/panel]
				[/column]
			[/row]
			[row]
				grow_factor=1
				[column]
					horizontal_alignment="edge"
					vertical_alignment="edge"
					[grid]
						[row]
							[column]
								horizontal_alignment="edge"
								vertical_alignment="edge"
								[image]
									definition="default"
									id="left_spacer"
									label="misc/bg_ffffff.png"
								[/image]
							[/column]
							[column]
								grow_factor=1
								horizontal_alignment="edge"
								vertical_alignment="edge"
								[grid]
									[row]
										grow_factor=1
										[column]
											horizontal_alignment="edge"
											vertical_alignment="edge"
											[spacer]
												definition="default"
												id="_main_map"
											[/spacer]
										[/column]
									[/row]
									[row]
										[column]
											horizontal_alignment="edge"
											[panel]
												bottom_margin=0
												definition="default"
												label="misc/bg_f3f3f3.png"
												top_margin=0
												[grid]
													[row]
														[column]
															horizontal_alignment="edge"
															[image]
																definition="default"
																label="misc/split_line.png"
															[/image]
														[/column]
													[/row]
													[row]
														[column]
															horizontal_alignment="left"
															[label]
																definition="default"
																id="status"
																mtwusc=true
																state=1
																text_font_size=998
															[/label]
														[/column]
													[/row]
												[/grid]
											[/panel]
										[/column]
									[/row]
								[/grid]
							[/column]
						[/row]
					[/grid]
				[/column]
			[/row]
		[/grid]
	[/resolution]
[/window]
