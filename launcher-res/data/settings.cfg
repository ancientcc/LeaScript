#textdomain rose-lib

[settings]
	[server]
        name=_"Official Kingdom Server"
        address=www.sanguohero.com:15000
    [/server]
    [server]
        name=_"Alternate Kingdom Server"
        address=www.leagor.com:15000
    [/server]
    [server]
        name=_"Common LAN Server"
        address=192.168.1.100:15000
    [/server]
    
    version = "1.0.1-20260926"  # must >= 1.0.1-20220226
    base_income=0
    village_income=2
    hero_income=2
    poison_amount=24
    rest_heal_amount=4
    recall_cost=0
    kill_experience=6
	max_cards=20
	default_ai_level=2
	
    title_music="main_menu.ogg"
    lobby_music="silence.ogg"
    default_victory_music="victory.ogg,victory2.ogg"
    default_defeat_music="defeat.ogg,defeat2.ogg"

    lobby_refresh=1000

    hp_bar_scaling=0.6
    xp_bar_scaling=0.5

    #temporary disable hex brightening
    hex_brightening=1.0
    hex_semi_brightening=1.25

    [images]
        game_title="maps/wesnoth.png"

        moved_orb="misc/orb_moved.png"
        unmoved_orb="misc/orb_unmoved.png"
        partmoved_orb="misc/orb_partmoved.png"
        enemy_orb="misc/orb_enemy.png"
        ally_orb="misc/orb_ally.png"
        automatic_orb="misc/orb_auto.png"
        energy="misc/bar_energy.png"
		bar_hrl_72 = "misc/bar_hrl_72.png"
		bar_hrl_64 = "misc/bar_hrl_64.png"
		bar_hrl_56 = "misc/bar_hrl_56.png"
		bar_hrl_48 = "misc/bar_hrl_48.png"

        flag="flags/flag_1.png:150,flags/flag_2.png:150,flags/flag_3.png:150,flags/flag_4.png:150"
        flag_icon="flags/flag_icon.png"
		big_flag="flags/loyalist_big_flag_1.png:150,flags/loyalist_big_flag_2.png:150,flags/loyalist_big_flag_3.png:150,flags/loyalist_big_flag_4.png:150"
		
        observer="misc/eye.png"
        tod_bright="misc/tod_bright.png"
        tod_dark="misc/tod_dark.png"
        level="misc/icon_advance.png"
        ellipsis="misc/icon_ellipsis.png"

        missing="misc/missing_image.png"
    [/images]

    fog_prefix="terrain_hexagonal/fog/fog"
    shroud_prefix="terrain_hexagonal/void/void"
    
[/settings]
